        mark: function (m) { grid.mark(m && m.f, m ? m.h : true); },
        lock: function (ro, done) { E.setInputs(grid.all(), ro, done); },
        solution: function () {
          return h('div', null, P('Kopf: „Z in Imp/min“'), h('ul', null, W3SRC.map(function (s) {
            return h('li', null, 'Präparat ' + s + ' (' + { alpha: 'Alpha', beta: 'Beta', gamma: 'Gamma' }[w.p.map[s]] + '): ' + W3ABS.map(function (a) { var m = find(s, a, 60); return m ? m.N : '–'; }).join(' · '));
          })));
        },
        fill: function () {
          E.put(grid.corner, tst, 'h', 'Z in Imp/min');
          W3SRC.forEach(function (s, r) { W3ABS.forEach(function (a, c) { var m = find(s, a, 60) || quick(s, a, 60); grid.set(r, c, m.N); }); });
        }
      });
      var sVer = E.tasks('verhalten', 'Was hält die Strahlung auf?', KP.V.w3.verhalten);
      var sec2 = E.section('Versuch: drei unbekannte Präparate', [
        P('Die drei Präparate A, B und C stehen nacheinander im Halter, 3 cm vor dem Zählrohr. Zwischen Präparat und Zählrohr kannst du ein Blatt Papier, eine 3 mm dicke Aluminiumplatte oder eine 2 cm dicke Bleiplatte stellen.'),
        KP.howto(['Während einer Messung kannst du das Präparat und die Abschirmung nicht wechseln.']),
        apparLock, appar.el, log.el, sNull.el, sTab.el, sVer.el
      ]);

      var sSich = E.tasks('sicherung', 'Welche Strahlung ist es?', KP.V.w3.sicherung, {
        before: [E.cards([
          [L.leifiUeberblick, 'LEIFIphysik', 'Überblick über die Strahlungsarten', 'Lies den Kasten und die Tabelle.'],
          [L.leifiSr, 'LEIFIphysik · Versuch', 'Untersuchung der Strontium-90-Strahlung', 'Lies die Abschnitte von „Versuchsaufbau“ bis „Beobachtungen“.'],
          [L.leifiIon, 'LEIFIphysik', 'Ionisierung durch Strahlung', 'Lies den Kasten und den Abschnitt „Ionisierung elektrisch neutraler Moleküle“.']
        ])]
      });
      var sec3 = E.section('Sicherung: Alpha-, Beta- und Gammastrahlung', [
        P('Jetzt erfährst du, wie die drei Strahlungsarten heißen und wodurch man sie abschirmen kann. Vergleiche mit deinen Messungen.'),
        sSich.el
      ]);
      var sUeb = E.tasks('uebung', 'Übung: unbekannte Präparate', KP.V.w3.uebung);
      var sec4 = E.section('Übungen', [sUeb.el]);
      var sRw = E.tasks('reichweite', 'Wie weit kommt die Strahlung?', T.reichweite, {
        optional: true, lockText: 'Gesperrt – löse zuerst die Übung.', okText: 'Richtig!',
        before: [P('In der Tabelle bei LEIFIphysik („Überblick über die Strahlungsarten“) steht auch, wie weit die Strahlung in Luft kommt. Nutze sie für die Fragen.')]
      });
      var sec4b = E.section('Zusatzaufgabe (freiwillig)', [sRw.el], 'sec-opt');
      var sLeifi = E.leifi('leifi', {
        url: L.leifiElektroskop, title: 'Nachweis von ionisierender Strahlung mit dem Elektroskop',
        note: 'Erinnerung: Ein geladenes Elektroskop zeigt einen Ausschlag. Verliert es seine Ladung, geht der Ausschlag zurück.'
      });
      var sec5 = E.section('Abschlussaufgabe', [sLeifi.el]);
      return E.mount(root, { intro: 'Radioaktive Präparate senden verschiedene Arten von Strahlung aus. Mit dem simulierten Zählrohr untersuchst du, welche Stoffe die Strahlung von drei unbekannten Präparaten aufhalten.' },
        [sec1, sec2, sec3, sec4, sec4b, sec5]);
    }
  });
})();

</script>
<script>
// Wochen 5 bis 7: Zerfallsgleichungen · Zerfallsgesetz und Halbwertszeit · Absorptionsgesetz
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, C = KP.C, P = KP.P;

  // =====================================================================
  // Woche 5
  KP.defineWeek({
    n: 5,
    order: ['lesen', 'alpha', 'beta', 'gemischt', 'nuklidkarte', 'reihe', 'leifi'],
    optional: { zerfallsreihe: 'reihe' },
    render: function (E, root) {
      var L = E.L, T = E.T, G = E.gen('varianten', KP.V.w5.all);
      var sLesen = E.tasks('lesen', 'Fragen zu den Texten', T.lesen);
      var sec1 = E.section('Einstieg: Was passiert im Atomkern?', [
        P('Lies die drei Texte bei LEIFIphysik. Beantworte danach die Fragen.'),
        E.cards([
          [L.leifiAlpha, 'LEIFIphysik', 'Alphazerfall und Alphastrahlung', 'Lies den Kasten „Das Wichtigste auf einen Blick“ und den Abschnitt zum Alphazerfall mit der Abbildung.'],
          [L.leifiBeta, 'LEIFIphysik', 'Beta-Minus-Zerfall und Beta-Minus-Strahlung', 'Lies den Kasten „Das Wichtigste auf einen Blick“ und Abb. 1 mit dem Text darunter.'],
          [L.leifiGamma, 'LEIFIphysik', 'Gammaübergang und Gammastrahlung', 'Lies den Abschnitt „Gammaübergang“. Hör vor der Überschrift „Eigenschaften von Gammastrahlung“ auf.']
        ]),
        sLesen.el
      ]);
      var sAlpha = E.tasks('alpha', 'Alphazerfall', G.alpha, {
        before: [P('Ergänze die Zerfallsgleichungen. Trage oben die Massenzahl, unten die Kernladungszahl und daneben das Elementsymbol ein.'), KP.pse(G.pse)]
      });
      var sBeta = E.tasks('beta', 'Beta-Minus-Zerfall', G.beta, {
        before: [P('Das Elektron schreibt man als [[0,-1,e]]. Das Antineutrino, das LEIFI zusätzlich nennt, lässt du in den Gleichungen weg.'), KP.pse(G.pse)]
      });
      var sGem = E.tasks('gemischt', 'Gemischte Aufgaben', G.gemischt, { before: [KP.pse(G.pse)] });
      var sec2 = E.section('Zerfallsgleichungen', [sAlpha.el, sBeta.el, sGem.el]);
      var sNuk = E.tasks('nuklidkarte', 'Fragen zur Nuklidkarte', T.nuklidkarte, {
        before: [KP.linkCard(L.leifiNuklid, 'LEIFIphysik', 'Nuklidkarte', 'Lies den ganzen Artikel.')]
      });
      var sec3 = E.section('Die Nuklidkarte', [sNuk.el]);
      var sReihe = E.tasks('reihe', 'Der Anfang einer Zerfallsreihe', G.reihe, {
        before: [P(G.reiheName + ' zerfällt über viele Zwischenschritte. Die ersten vier Zerfälle sind: ' + G.reiheText + '. Gib nach jedem Zerfall den entstandenen Kern an.'), KP.pse([88, 89, 90, 91, 92])]
      });
      var sec4 = E.section('Eine Zerfallsreihe', [sReihe.el]);
      var sZr = E.tasks('zerfallsreihe', 'Vom Uran zum Blei', KP.V.w5.zusatz, {
        optional: true, lockText: 'Gesperrt – löse zuerst die Aufgabe zur Zerfallsreihe.', okText: 'Richtig!',
        before: [P('Eine Zerfallsreihe endet erst bei einem stabilen Kern. Du musst dafür nicht jeden Zwischenschritt kennen: Überlege, wie sich die Massenzahl und die Kernladungszahl insgesamt ändern.')]
      });
      var sec5 = E.section('Zusatzaufgabe (freiwillig)', [sZr.el], 'sec-opt');
      var sLeifi = E.leifi('leifi', { url: L.leifiEntstehung, title: 'Entstehung von Alpha-, Beta- und Gammastrahlung' });
      var sec6 = E.section('Abschlussaufgabe', [sLeifi.el]);
      return E.mount(root, { intro: 'Woher kommt die Strahlung? Du liest, was im Atomkern beim Alphazerfall, beim Beta-Minus-Zerfall und beim Gammaübergang passiert, und stellst selbst Zerfallsgleichungen auf.' },
        [sec1, sec2, sec3, sec4, sec5, sec6]);
    }
  });

  // Gemeinsamer Ablauf der Auswertung für Woche 6 und 7: Tabelle mit Zeilen, Diagramm, Halbwertsgröße
  function exactNum(text, v) { var x = C.parseNum(text); return isFinite(x) && Math.abs(x - v) < 1e-9; }

  // =====================================================================
  // Woche 6: Barium-137m. Eluat in drei Schritten herstellen, Uhr ab der ersten Messung,
  // zu jeder vollen Minute eine Messung mit der Torzeit 30 s
  var TH = 2.55 * 60;          // Halbwertszeit von Ba-137m in s
  var G6 = 30;                 // Torzeit der Messungen mit Eluat
  var TT = [0, 1, 2, 3, 4, 5, 6, 7];
  // Zu welcher vollen Minute gehört eine Messung? Start höchstens 10 s zu früh oder 20 s zu spät
  function slot6(m) {
    if (!m || m.c0 == null) return -1;
    var k = Math.round(m.c0 / 60), d = m.c0 - 60 * k;
    return d >= -10 && d <= 20 ? k : -1;
  }
  KP.slot6 = slot6;
  KP.defineWeek({
    n: 6,
    order: ['lesen', 'nullrate', 'messreihe', 'bereinigt', 'achsen', 'punkte', 'kurve', 'halbwert', 'deutung', 'sicherung', 'uebung', 'leifi'],
    optional: { wuerfel: 'uebung' },
    render: function (E, root) {
      var w = E.w, L = E.L, T = E.T;
      if (!w.meas) w.meas = [];
      if (!w.app) w.app = {};
      if (!w.plot) w.plot = {};
      if (!w.p) w.p = { z0: KP.makeZ0(), r0: Math.round(3600 + Math.random() * 1200) };
      var tab = E.obj('tab', {}), hw = E.obj('hw', { th: '', tq: '' });

      var sLesen = E.tasks('lesen', 'Fragen zum Text', T.lesen);
      var sec1 = E.section('Einstieg: Wovon hängt die Aktivität ab?', [
        P('Heute untersuchst du, wie sich die Zählrate eines Präparats im Lauf der Zeit verändert. Lies vorher kurz bei LEIFIphysik nach, wovon die Aktivität eines Präparats abhängt. Beantworte danach die Fragen.'),
        E.cards([[L.leifiAktiv, 'LEIFIphysik', 'Aktivität eines Präparats', 'Lies nur den Abschnitt „Einflussgrößen auf die Aktivität eines Präparates“.']]),
        sLesen.el
      ]);

      var log = E.mlog(function () { return w.meas; }, function (m) {
        return m.src ? 'Eluat ' + String(m.eluat).slice(-4) + ', Start bei ' + KP.mmss(m.c0) + ' · Torzeit ' + KP.gateLabel(m.gate) + ' · N = ' + m.N
          : 'Torzeit ' + KP.gateLabel(m.gate) + ' · ohne Eluat · N = ' + m.N;
      });
      function addMeas(m) { E.addMeas(w.meas, m, 600); log.render(); }
      function quickNull() { var m = { src: false, r: 3, abs: '', gate: C.GATE, N: KP.poisson(w.p.z0 / 60 * C.GATE), t: Date.now() }; addMeas(m); return m; }
      // vollständige Messreihe mit einem frischen Eluat (nur für die Lehrkraft)
      function quickSeries() {
        var id = 'q' + Date.now().toString(36), r0 = w.p.r0 * (0.92 + Math.random() * 0.16), out = [];
        TT.forEach(function (k) {
          var c0 = 60 * k, mu = (w.p.z0 * G6 + r0 * TH / Math.LN2 * (Math.pow(2, -c0 / TH) - Math.pow(2, -(c0 + G6) / TH))) / 60;
          var m = { src: true, r: 3, abs: '', gate: G6, eluat: id, c0: c0, N: KP.poisson(mu), t: Date.now() };
          addMeas(m);
          out.push(m);
        });
        return out;
      }
      // je Eluat: zu jeder vollen Minute die passenden Messungen
      function series() {
        var g = {};
        w.meas.forEach(function (m) {
          if (!m.src || m.gate !== G6 || !m.eluat) return;
          var k = slot6(m);
          if (k < 0 || k >= TT.length) return;
          var e = g[m.eluat] = g[m.eluat] || { id: m.eluat, slots: TT.map(function () { return []; }), t: 0 };
          e.slots[k].push(m);
          e.t = Math.max(e.t, m.t || 0);
        });
        return Object.keys(g).map(function (k) { return g[k]; }).sort(function (a, b) { return a.t - b.t; });
      }
      function complete() { return series().filter(function (e) { return e.slots.every(function (l) { return l.length; }); }); }
      var appar = KP.Apparatus({
        state: w.app, mode: 'fixed', fixedPos: 3, rulerMax: 10, srcShape: 'beaker',
        sources: [{ id: true, label: 'Eluat' }], eluat: { gate: G6 },
        rate: function (s) {
          if (!s.src || !s.eluat) return w.p.z0 / 60;
          var r0 = w.p.r0 * (s.a || 1), a0 = s.age0 || 0;
          return function (t) { return (w.p.z0 + r0 * Math.pow(2, -(a0 + t) / TH)) / 60; };
        },
        teacher: KP.teacher, onMeasure: addMeas,
        onQuickAll: function () { quickNull(); quickSeries(); }
      });
      E.onDestroy(appar.destroy);
      var apparLock = h('p', { class: 'lock-note' }, 'Der Versuch wird freigeschaltet, wenn du die Fragen zum Einstieg richtig beantwortet hast.');
      E.onRefresh(function () { var open = E.isOpen('nullrate'); appar.setLocked(!open); apparLock.hidden = open; });
      var sNull = E.nullrate({
        meas: function () { return w.meas; }, quick: quickNull,
        text: 'Miss zuerst ohne Eluat: Stelle die Torzeit 00:02:00 ein und miss die Nullrate. Trage die Anzahl der Impulse N₀ ein und gib die Nullrate Z₀ in Imp/min an.',
        lockText: 'Gesperrt – beantworte zuerst die Fragen zum Einstieg.'
      });
      var nul = sNull.nul;
      var sec2 = E.section('Versuch: Barium-137m aus dem Isotopengenerator', [
        P('Im Isotopengenerator entsteht ständig Barium-137m. Mit einer Spülflüssigkeit wird es herausgelöst. Diese Lösung heißt Eluat. Du stellst das Eluat in drei kleinen Schritten selbst her: Generator spülen, Eluat im Becherglas auffangen, Becherglas vor das Zählrohr stellen.'),
        h('div', { class: 'plan' },
          h('p', { class: 'plan-h' }, 'So misst du mit dem Eluat'),
          h('ol', null,
            h('li', null, 'Stelle die Torzeit 00:00:30 ein.'),
            h('li', null, 'Starte die erste Messung gleich, nachdem das Becherglas vor dem Zählrohr steht. Mit ihr beginnt die Uhr zu laufen.'),
            h('li', null, 'Trage N ein und drücke „Reset“. Starte die nächste Messung, sobald die Uhr die nächste volle Minute zeigt: 01:00, 02:00 und so weiter bis 07:00.'),
            h('li', null, 'Hast du eine volle Minute verpasst oder ist etwas schiefgegangen? Stelle das Becherglas weg und stelle frisches Eluat her. Dann beginnt alles von vorn.'))),
        KP.howto(['Während einer Messung kannst du das Becherglas nicht wegstellen.']),
        apparLock, appar.el, log.el, sNull.el
      ]);

      // Tabelle
      var tb = E.rowTable({
        cols: TT.length, store: tab, rows: [
          { k: 't', step: 'messreihe', name: 'Zeit' },
          { k: 'N', step: 'messreihe', name: 'Impulse' },
          { k: 'Zs', step: 'bereinigt', name: 'bereinigte Zählrate' }
        ]
      });
      function seriesCheck() {
        var hT = C.labelOk(tab.h.t, ['t in min']), hN = C.labelOk(tab.h.N, C.LABELS.N);
        var tf = TT.map(function (t, i) { return exactNum(tab.t[i], t); });
        var best = TT.map(function () { return false; }), bestN = -1;
        series().forEach(function (e) {
          var f = TT.map(function (t, i) { var v = C.parseNum(tab.N[i]); return e.slots[i].some(function (m) { return m.N === v; }); });
          var n = f.filter(Boolean).length;
          if (n > bestN) { bestN = n; best = f; }
        });
        var ok = hT && hN && C.all(tf) && C.all(best);
        return { ok: ok, marks: { hT: hT, hN: hN, t: tf, N: best },
          msg: ok || C.all(best) ? null : 'Jeder Wert N muss von einer Messung mit demselben Eluat stammen, mit der Torzeit 30 s, gestartet zur passenden vollen Minute (höchstens 20 s später).' };
      }
      var sMR = E.step('messreihe', 'Messwerte eintragen', {
        body: [P('Trage in die erste Zeile die Startzeiten t der Messungen in Minuten ein (0, 1, 2, …). Trage darunter die Impulse N ein, die du zu diesen Zeiten gemessen hast.')],
        check: seriesCheck,
        mark: function (m) { tb.markRow('t', m && m.hT, m && m.t); tb.markRow('N', m && m.hN, m && m.N); },
        lock: function (ro, done) { E.setInputs(tb.inputs(['t', 'N']), ro, done); },
        solution: function () {
          var c = complete(); c = c[c.length - 1];
          return P('Kopf „t in min“ und „N in Imp“; letzte vollständige Messreihe: ' + (c ? c.slots.map(function (l) { return l[l.length - 1].N; }).join(' · ') : '–'));
        },
        fill: function () {
          var c = complete(); c = c[c.length - 1];
          var vals = c ? c.slots.map(function (l) { return l[l.length - 1].N; }) : quickSeries().map(function (m) { return m.N; });
          tb.setHead('t', 't in min');
          tb.setHead('N', 'N in Imp');
          tb.setRow('t', TT.map(String));
          tb.setRow('N', vals.map(String));
        }
      });
      var sZs = E.step('bereinigt', 'Bereinigte Zählrate', {
        body: [P('Eine Messung dauert 30 s = 0,5 min. Die Zählrate in Imp/min ist also doppelt so groß wie N. Berechne für jede Messung die bereinigte Zählrate Z* = N / (0,5 min) − Z₀.')],
        check: function () {
          var z0 = C.parseNum(nul.Z0), hOk = C.labelOk(tab.h.Zs, C.LABELS.Zs);
          var f = TT.map(function (t, i) { return C.close(C.parseNum(tab.Zs[i]), 2 * C.parseNum(tab.N[i]) - z0, 0.5); });
          return { ok: hOk && C.all(f), marks: { h: hOk, f: f } };
        },
        mark: function (m) { tb.markRow('Zs', m && m.h, m && m.f); },
        lock: function (ro, done) { E.setInputs(tb.inputs(['Zs']), ro, done); },
        solution: function () { var z0 = C.parseNum(nul.Z0); return P('Kopf „Z* in Imp/min“; Z* = 2 · N − Z₀: ' + TT.map(function (t, i) { var n = C.parseNum(tab.N[i]); return isFinite(n) ? E.num(2 * n - z0) : '–'; }).join(' · ')); },
        fill: function () {
          var z0 = C.parseNum(nul.Z0);
          tb.setHead('Zs', 'Z* in Imp/min');
          tb.setRow('Zs', TT.map(function (t, i) { var n = C.parseNum(tab.N[i]); return isFinite(n) && isFinite(z0) ? E.num(2 * n - z0) : ''; }));
        }
      });
      var z0line = h('p', { class: 'z0line' });
      E.onRefresh(function () { z0line.hidden = !E.visible('bereinigt'); z0line.textContent = 'Deine Nullrate: Z₀ = ' + (nul.Z0 || '…') + ' Imp/min'; });
      var sec3 = E.section('Messwerttabelle', [
        E.widget('messreihe', 'Die Tabelle wird freigeschaltet, wenn du die Nullrate gemessen hast.', [tb.el, z0line]),
        sMR.el, sZs.el
      ]);

      // Diagramm
      function pts() { return TT.map(function (t, i) { return [t, C.parseNum(tab.Zs[i])]; }); }
      function zsv() { return pts().map(function (p) { return p[1]; }); }
      var pg = E.plotGroup({
        st: w.plot, label: 'Diagramm: bereinigte Zählrate in Abhängigkeit von der Zeit',
        xLabels: ['t in min'], yLabels: C.LABELS.Zs, count: TT.length,
        points: pts,
        scale: function () { return C.plotScaleGen(zsv(), 8, 1); },
        model: function (e) { var f = C.fitExp(e); return f ? f.fn : null; },
        curveOpt: { from: 0, to: 8, lo: 0.2, hi: 7.4, coverFrom: 0.5, coverTo: 6.8 },
        pointsText: 'Trage deine acht Messpunkte (t | Z*) als Kreuze ein. Tippe, um einen Punkt zu setzen. Ziehe einen Punkt, um ihn zu verschieben.'
      });
      var sec4 = E.section('Diagramm', [
        P('Trage die bereinigte Zählrate Z* über der Zeit t auf: t nach rechts, Z* nach oben.'),
        E.widget('achsen', 'Das Diagramm wird freigeschaltet, wenn deine Tabelle vollständig ist.', [pg.el]),
        pg.steps[0].el, pg.steps[1].el, pg.steps[2].el
      ]);

      // Halbwertszeit
      var inTh = E.bindNum('th', hw, 'th', 'Halbwertszeit'), inTq = E.bindNum('tq', hw, 'tq', 'Zeit bis zu einem Viertel');
      function half() { var f = C.fitExp(pts()); return f ? f.half : NaN; }
      var sHalb = E.step('halbwert', 'Halbwertszeit ablesen', {
        body: [
          P('Lies an deiner Kurve ab: Nach welcher Zeit ist Z* auf die Hälfte des Anfangswerts gesunken? Nach welcher Zeit auf ein Viertel?'),
          h('div', { class: 'eq-row' }, h('span', { class: 'pre' }, h('i', null, 'T'), '½ ='), inTh, h('span', { class: 'unit' }, 'min')),
          h('div', { class: 'eq-row' }, h('span', { class: 'pre' }, 'auf ein Viertel nach'), inTq, h('span', { class: 'unit' }, 'min')),
          KP.tip('Lies zuerst den Anfangswert der Kurve bei t = 0 ab und halbiere ihn. Suche dann auf der Kurve die Stelle mit diesem Wert und lies darunter die Zeit ab.', L.serloKoord, 'Koordinatensystem')
        ],
        check: function () {
          var hv = half(), a = C.close(C.parseNum(hw.th), hv, Math.max(0.4, 0.15 * hv)), b = C.close(C.parseNum(hw.tq), 2 * hv, Math.max(0.6, 0.3 * hv));
          return { ok: a && b, marks: { a: a, b: b } };
        },
        mark: function (m) { inTh.classList.toggle('bad', !!m && !m.a); inTq.classList.toggle('bad', !!m && !m.b); },
        lock: function (ro, done) { E.setInputs([inTh, inTq], ro, done); },
        solution: function () { var hv = half(); return P(isFinite(hv) ? 'Aus deinen Messwerten: T½ ≈ ' + E.num(hv, 2) + ' min, ein Viertel nach ≈ ' + E.num(2 * hv, 2) + ' min.' : 'Erst die Tabelle ausfüllen.'); },
        fill: function () { var hv = half(); if (!isFinite(hv)) return; E.put(inTh, hw, 'th', E.num(hv, 1)); E.put(inTq, hw, 'tq', E.num(2 * hv, 1)); }
      });
      var sDeut = E.tasks('deutung', 'Was bedeutet deine Messung?', KP.V.w6.deutung);
      var sec5 = E.section('Auswertung', [sHalb.el, sDeut.el]);

      var sSich = E.tasks('sicherung', 'Vergleich mit dem echten Versuch', KP.V.w6.sicherung, {
        before: [E.cards([
          [L.leifiHalb, 'LEIFIphysik', 'Halbwertszeit', 'Lies die ersten beiden Absätze und sieh dir die Animation an.'],
          [L.leifiBa, 'LEIFIphysik · Versuch', 'Bestimmung der Halbwertszeit von Ba-137m', 'Lies die Vorbemerkung, „Aufbau und Durchführung“ und „Beobachtung“. Wenn du magst, startest du den echten Versuch über das Internet (Anleitung unter „Bedienung des IBE“).']
        ])]
      });
      var sec6 = E.section('Sicherung: der echte Versuch', [
        P('Du hast mit deinem simulierten Versuch selbst herausgefunden, wie die Zählrate abnimmt. Bei LEIFIphysik findest du den echten Versuch mit dem Isotopengenerator.'),
        sSich.el
      ]);

      var sU = E.tasks('uebung', 'Rechnen mit der Halbwertszeit', KP.V.w6.uebung, {
        after: [KP.logTip('Halbwertszeiten', L)]
      });
      var sec7 = E.section('Übung', [P('Rechne mit der Halbwertszeit. Du darfst den Taschenrechner benutzen.'), sU.el]);
      var sW = E.tasks('wuerfel', 'Radioaktiver Zerfall mit Würfeln', T.wuerfel, {
        optional: true, lockText: 'Gesperrt – löse zuerst die Übung.', okText: 'Richtig!',
        before: [KP.linkCard(L.leifiWuerfel, 'LEIFIphysik · Versuch', 'Radioaktiver Zerfall mit Würfeln', 'Lies den Versuch. Wenn du Würfel hast, probiere ihn selbst aus.')]
      });
      var sec8 = E.section('Zusatzaufgabe (freiwillig)', [sW.el], 'sec-opt');
      var sLeifi = E.leifi('leifi', {
        url: L.leifiZerfallA, title: 'Experiment zum Zerfallsgesetz',
        what: 'Löse die Teilaufgaben b) und c) auf Papier. Teilaufgabe a) lässt du weg. Vergleiche danach mit der Musterlösung („Lösung einblenden“) und verbessere deine Lösung.'
      });
      var sec9 = E.section('Abschlussaufgabe', [sLeifi.el]);
      var stop = E.mount(root, { intro: 'Wie schnell nimmt die Strahlung eines Präparats ab? Du stellst frisches Barium-137m her und misst mit einem simulierten Zählrohr, wie seine Zählrate mit der Zeit sinkt.' },
        [sec1, sec2, sec3, sec4, sec5, sec6, sec7, sec8, sec9]);
      KP.w6 = { week: w, apparatus: appar, series: series };
      return function () { stop(); KP.w6 = null; };
    }
  });

  // =====================================================================
  // Woche 7
  var DV = [0, 0.5, 1, 1.5, 2, 2.5], DH = 0.65;
  function absId(d) { return 'd' + String(d).replace('.', '_'); }
  KP.defineWeek({
    n: 7,
    order: ['lesen', 'nullrate', 'messreihe', 'zaehlrate', 'bereinigt', 'achsen', 'punkte', 'kurve', 'halbdicke', 'deutung', 'sicherung', 'uebung', 'leifi'],
    optional: { beton: 'uebung' },
    render: function (E, root) {
      var w = E.w, L = E.L, T = E.T;
      if (!w.meas) w.meas = [];
      if (!w.app) w.app = {};
      if (!w.plot) w.plot = {};
      if (!w.p) w.p = KP.makeParams();
      var tab = E.obj('tab', {}), hd = E.obj('hd', { dh: '', dq: '' });
      function rateOf(src, abs) {
        var d = 0;
        DV.forEach(function (x) { if (absId(x) === abs) d = x; });
        return (w.p.z0 + (src ? w.p.k / 100 * Math.pow(2, -d / DH) : 0)) / 60;
      }

      var sLesen = E.tasks('lesen', 'Fragen zu den Texten', T.lesen);
      var sec1 = E.section('Einstieg: Abschirmen', [
        P('Heute untersuchst du, wie gut Blei die Gammastrahlung eines Präparats abschirmt. Lies vorher die beiden kurzen Abschnitte bei LEIFIphysik. Beantworte danach die Fragen.'),
        E.cards([
          [L.leifiSchutz, 'LEIFIphysik', 'Strahlenschutz', 'Lies nur den Abschnitt „Abschirmung verstärken!“.'],
          [L.leifiRadium, 'LEIFIphysik · Versuch', 'Gammastrahlung von Radium', 'Lies nur den Abschnitt „Zusammenfassung“.']
        ]),
        sLesen.el
      ]);

      var log = E.mlog(function () { return w.meas; }, function (m) {
        var d = 0; DV.forEach(function (x) { if (absId(x) === m.abs) d = x; });
        return KP.gateLabel(m.gate) + ' · ' + (m.src ? 'Blei ' + KP.fmt(d, 1) + ' cm' : 'ohne Präparat') + ' · N = ' + m.N;
      });
      function addMeas(m) { E.addMeas(w.meas, m); log.render(); }
      function quick(src, abs) { var m = { src: src, r: 10, abs: abs, gate: C.GATE, N: KP.poisson(rateOf(src, abs) * C.GATE), t: Date.now() }; addMeas(m); return m; }
      function find(abs) {
        for (var i = w.meas.length - 1; i >= 0; i--) { var m = w.meas[i]; if (m.src && m.abs === abs && m.gate === C.GATE) return m; }
        return null;
      }
      var appar = KP.Apparatus({
        state: w.app, mode: 'fixed', fixedPos: 10, rulerMax: 20, absPos: 5, alPlate: true,
        sources: [{ id: true, label: 'Cs-137' }],
        absorbers: DV.map(function (d) { return { id: absId(d), label: d ? KP.fmt(d, 1) + ' cm' : 'ohne', short: d ? 'Blei' : '', kind: d ? 'pb' : null, thick: d }; }),
        rate: function (s) { return rateOf(s.src, s.abs); },
        teacher: KP.teacher, onMeasure: addMeas,
        onQuickAll: function () { quick(false, absId(0)); DV.forEach(function (d) { quick(true, absId(d)); }); }
      });
      E.onDestroy(appar.destroy);
      var apparLock = h('p', { class: 'lock-note' }, 'Der Versuch wird freigeschaltet, wenn du die Fragen zum Einstieg richtig beantwortet hast.');
      E.onRefresh(function () { var open = E.isOpen('nullrate'); appar.setLocked(!open); apparLock.hidden = open; });
      var sNull = E.nullrate({
        meas: function () { return w.meas; }, quick: function () { return quick(false, w.app.abs || absId(0)); },
        text: 'Lege das Präparat in den Bleibehälter („Präparat entnehmen“). Stelle die Torzeit 00:02:00 ein und miss. Trage die Anzahl der Impulse N₀ ein und gib die Nullrate Z₀ in Imp/min an.',
        lockText: 'Gesperrt – beantworte zuerst die Fragen zum Einstieg.'
      });
      var nul = sNull.nul;
      var sec2 = E.section('Versuch: Gammastrahlung und Blei', [
        P('Das Cäsium-Präparat steht wieder hinter einer Aluminiumplatte, 10 cm vor dem Zählrohr. Zum Zählrohr gelangt nur die Gammastrahlung. Dazwischen kannst du Bleiplatten von 0,5 cm bis 2,5 cm Dicke stellen.'),
        KP.howto(['Während einer Messung kannst du das Präparat und die Bleiplatte nicht wechseln.']),
        apparLock, appar.el, log.el, sNull.el
      ]);

      var tb = E.rowTable({
        cols: DV.length, store: tab, rows: [
          { k: 'd', step: 'messreihe', name: 'Bleidicke' },
          { k: 'N', step: 'messreihe', name: 'Impulse' },
          { k: 'Z', step: 'zaehlrate', name: 'Zählrate' },
          { k: 'Zs', step: 'bereinigt', name: 'bereinigte Zählrate' }
        ]
      });
      var sMR = E.step('messreihe', 'Dicken und Impulse eintragen', {
        body: [P('Miss mit Präparat für jede Bleidicke d = 0 cm, 0,5 cm, …, 2,5 cm. Die Torzeit bleibt 00:02:00. Trage die Dicken und die Impulse N ein.')],
        check: function () {
          var hD = C.labelOk(tab.h.d, ['d in cm']), hN = C.labelOk(tab.h.N, C.LABELS.N);
          var df = DV.map(function (d, i) { return exactNum(tab.d[i], d); });
          var nf = DV.map(function (d, i) {
            var v = C.parseNum(tab.N[i]);
            return df[i] && C.isInt(v) && w.meas.some(function (m) { return m.src && m.abs === absId(d) && m.gate === C.GATE && m.N === v; });
          });
          return { ok: hD && hN && C.all(df) && C.all(nf), marks: { hD: hD, hN: hN, d: df, N: nf } };
        },
        mark: function (m) { tb.markRow('d', m && m.hD, m && m.d); tb.markRow('N', m && m.hN, m && m.N); },
        lock: function (ro, done) { E.setInputs(tb.inputs(['d', 'N']), ro, done); },
        solution: function () { return P('Kopf „d in cm“ und „N in Imp“; letzte Messungen: ' + DV.map(function (d) { var m = find(absId(d)); return KP.fmt(d, 1) + ' cm → ' + (m ? m.N : '–'); }).join(' · ')); },
        fill: function () {
          tb.setHead('d', 'd in cm');
          tb.setHead('N', 'N in Imp');
          tb.setRow('d', DV.map(function (d) { return KP.fmt(d, 1); }));
          tb.setRow('N', DV.map(function (d) { return String((find(absId(d)) || quick(true, absId(d))).N); }));
        }
      });
      var sZ = E.step('zaehlrate', 'Zählrate berechnen', {
        body: [P('Berechne aus den Impulsen die Zählrate Z in Imp/min.')],
        check: function () {
          var hOk = C.labelOk(tab.h.Z, C.LABELS.Z);
          var f = DV.map(function (d, i) { return C.close(C.parseNum(tab.Z[i]), C.parseNum(tab.N[i]) / 2, 0.5); });
          return { ok: hOk && C.all(f), marks: { h: hOk, f: f } };
        },
        mark: function (m) { tb.markRow('Z', m && m.h, m && m.f); },
        lock: function (ro, done) { E.setInputs(tb.inputs(['Z']), ro, done); },
        solution: function () { return P('Kopf „Z in Imp/min“; Z = N / 2 min'); },
        fill: function () { tb.setHead('Z', 'Z in Imp/min'); tb.setRow('Z', DV.map(function (d, i) { var n = C.parseNum(tab.N[i]); return isFinite(n) ? E.num(n / 2) : ''; })); }
      });
      var sZs = E.step('bereinigt', 'Nullrate abziehen', {
        body: [P('Ziehe von jeder Zählrate deine Nullrate Z₀ ab. Das Ergebnis ist die bereinigte Zählrate Z*.')],
        check: function () {
          var z0 = C.parseNum(nul.Z0), hOk = C.labelOk(tab.h.Zs, C.LABELS.Zs);
          var f = DV.map(function (d, i) { return C.close(C.parseNum(tab.Zs[i]), C.parseNum(tab.Z[i]) - z0, 0.5); });
          return { ok: hOk && C.all(f), marks: { h: hOk, f: f } };
        },
        mark: function (m) { tb.markRow('Zs', m && m.h, m && m.f); },
        lock: function (ro, done) { E.setInputs(tb.inputs(['Zs']), ro, done); },
        solution: function () { return P('Kopf „Z* in Imp/min“; Z* = Z − Z₀'); },
        fill: function () {
          var z0 = C.parseNum(nul.Z0);
          tb.setHead('Zs', 'Z* in Imp/min');
          tb.setRow('Zs', DV.map(function (d, i) { var z = C.parseNum(tab.Z[i]); return isFinite(z) && isFinite(z0) ? E.num(z - z0) : ''; }));
        }
      });
      var z0line = h('p', { class: 'z0line' });
      E.onRefresh(function () { z0line.hidden = !E.visible('bereinigt'); z0line.textContent = 'Deine Nullrate: Z₀ = ' + (nul.Z0 || '…') + ' Imp/min'; });
      var sec3 = E.section('Messwerttabelle', [
        E.widget('messreihe', 'Die Tabelle wird freigeschaltet, wenn du die Nullrate gemessen hast.', [tb.el, z0line]),
        sMR.el, sZ.el, sZs.el
      ]);

      function pts() { return DV.map(function (d, i) { return [d, C.parseNum(tab.Zs[i])]; }); }
      var pg = E.plotGroup({
        st: w.plot, label: 'Diagramm: bereinigte Zählrate in Abhängigkeit von der Bleidicke',
        xLabels: ['d in cm'], yLabels: C.LABELS.Zs, count: DV.length,
        points: pts,
        scale: function () { return C.plotScaleGen(pts().map(function (p) { return p[1]; }), 3, 0.5); },
        model: function (e) { var f = C.fitExp(e); return f ? f.fn : null; },
        curveOpt: { from: 0, to: 2.8, lo: 0.05, hi: 2.5, coverFrom: 0.15, coverTo: 2.3 },
        pointsText: 'Trage deine sechs Messpunkte (d | Z*) als Kreuze ein. Tippe, um einen Punkt zu setzen. Ziehe einen Punkt, um ihn zu verschieben.'
      });
      var sec4 = E.section('Diagramm', [
        P('Trage die bereinigte Zählrate Z* über der Bleidicke d auf: d nach rechts, Z* nach oben.'),
        E.widget('achsen', 'Das Diagramm wird freigeschaltet, wenn deine Tabelle vollständig ist.', [pg.el]),
        pg.steps[0].el, pg.steps[1].el, pg.steps[2].el
      ]);

      var inDh = E.bindNum('dh', hd, 'dh', 'Halbwertsdicke'), inDq = E.bindNum('dq', hd, 'dq', 'Dicke für ein Viertel');
      function half() { var f = C.fitExp(pts()); return f ? f.half : NaN; }
      var sHd = E.step('halbdicke', 'Halbwertsdicke ablesen', {
        body: [
          P('Lies an deiner Kurve ab: Bei welcher Bleidicke ist Z* auf die Hälfte des Wertes ohne Blei gesunken? Diese Dicke heißt Halbwertsdicke d½. Bei welcher Dicke ist Z* auf ein Viertel gesunken?'),
          h('div', { class: 'eq-row' }, h('span', { class: 'pre' }, h('i', null, 'd'), '½ ='), inDh, h('span', { class: 'unit' }, 'cm')),
          h('div', { class: 'eq-row' }, h('span', { class: 'pre' }, 'auf ein Viertel bei'), inDq, h('span', { class: 'unit' }, 'cm'))
        ],
        check: function () {
          var hv = half(), a = C.close(C.parseNum(hd.dh), hv, Math.max(0.1, 0.15 * hv)), b = C.close(C.parseNum(hd.dq), 2 * hv, Math.max(0.15, 0.3 * hv));
          return { ok: a && b, marks: { a: a, b: b } };
        },
        mark: function (m) { inDh.classList.toggle('bad', !!m && !m.a); inDq.classList.toggle('bad', !!m && !m.b); },
        lock: function (ro, done) { E.setInputs([inDh, inDq], ro, done); },
        solution: function () { var hv = half(); return P(isFinite(hv) ? 'Aus deinen Messwerten: d½ ≈ ' + E.num(hv, 2) + ' cm, ein Viertel bei ≈ ' + E.num(2 * hv, 2) + ' cm.' : 'Erst die Tabelle ausfüllen.'); },
        fill: function () { var hv = half(); if (!isFinite(hv)) return; E.put(inDh, hd, 'dh', E.num(hv, 2)); E.put(inDq, hd, 'dq', E.num(2 * hv, 2)); }
      });
      var sDeut = E.tasks('deutung', 'Was bedeutet deine Messung?', T.deutung);
      var sec5 = E.section('Auswertung', [sHd.el, sDeut.el]);

      var sSich = E.tasks('sicherung', 'Vergleich mit LEIFIphysik', KP.V.w7.sicherung, {
        before: [KP.linkCard(L.leifiGamma, 'LEIFIphysik', 'Gammaübergang und Gammastrahlung', 'Lies jetzt die Abschnitte „Eigenschaften von Gammastrahlung“ und „Reichweite von Gammastrahlung“ mit der Tabelle.')]
      });
      var sec6 = E.section('Sicherung', [
        P('Du hast mit deinem simulierten Versuch herausgefunden, wie Blei die Gammastrahlung abschwächt. Vergleiche dein Ergebnis mit den Angaben bei LEIFIphysik.'),
        sSich.el
      ]);
      var sU = E.tasks('uebung', 'Rechnen mit der Halbwertsdicke', KP.V.w7.uebung, {
        after: [KP.logTip('Halbwertsdicken', L, 'Die Dicke der Wand ist dann n · d½.')]
      });
      var sec7 = E.section('Übung', [P('Rechne mit der Halbwertsdicke. Du darfst den Taschenrechner benutzen.'), sU.el]);
      var sBe = E.tasks('beton', 'Abschirmen mit Beton und Wasser', KP.V.w7.beton, {
        optional: true, lockText: 'Gesperrt – löse zuerst die Übung.', okText: 'Richtig!',
        before: [P('Nicht nur Blei schirmt Gammastrahlung ab, sondern auch Beton und Wasser – sie müssen aber viel dicker sein. Nutze die Tabelle mit den Halbwertsdicken bei LEIFIphysik, die du in der Sicherung gelesen hast.')]
      });
      var sec7b = E.section('Zusatzaufgabe (freiwillig)', [sBe.el], 'sec-opt');
      var sLeifi = E.leifi('leifi', { url: L.leifiAnwend, title: 'Anwendungen ionisierender Strahlung' });
      var sec8 = E.section('Abschlussaufgabe', [sLeifi.el]);
      return E.mount(root, { intro: 'Wie gut schirmt Blei Gammastrahlung ab? Du stellst Bleiplatten verschiedener Dicke zwischen Präparat und Zählrohr und findest heraus, wie die Zählrate von der Dicke abhängt.' },
        [sec1, sec2, sec3, sec4, sec5, sec6, sec7, sec7b, sec8]);
    }
  });
})();

</script>
<script>
// Wochen 8 bis 10: Strahlenwirkung, Dosis und Röntgenstrahlung · Kernspaltung, Kettenreaktion und Kernkraftwerk · Kernfusion und Abschlussquiz
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, C = KP.C, P = KP.P;

  // Beschriften als Schritt: Begriffe in Felder ziehen
  function labelStep(E, id, title, cfg) {
    var st = E.obj(id, {});
    var lb = KP.Labeler({ id: 'lb-' + id, chips: cfg.chips, zones: cfg.zones, rows: cfg.rows, figure: cfg.figure, figClass: cfg.figClass, store: st,
      order: E.rng(id + ':chips').perm(cfg.chips.length), onChange: function () { KP.save(); } });
    return E.step(id, title, {
      body: (cfg.before || []).concat([lb.el]),
      check: function () { return lb.check(cfg.sol); },
      mark: function (m) { lb.mark(m); },
      lock: function (ro, done) { lb.setLocked(ro, done); },
      solution: function () {
        var names = cfg.rows ? cfg.rows.map(function (r) { return r.text; }) : null;
        return h('ul', null, Object.keys(cfg.sol).map(function (k, i) {
          return h('li', null, (names ? names[i] + ' → ' : (cfg.zoneNames ? cfg.zoneNames[k] + ': ' : '')) + cfg.chips[cfg.sol[k]]);
        }));
      },
      fill: function () { lb.fill(cfg.sol); }
    });
  }

  // =====================================================================
  // Woche 8: Strahlenwirkung, Dosis und Röntgenstrahlung
  KP.defineWeek({
    n: 8,
    order: ['wirkung', 'dosis', 'dosisleistung', 'roentgen', 'roehre', 'funktion', 'regeln', 'leifi'],
    optional: { radon: 'regeln' },
    render: function (E, root) {
      var L = E.L, T = E.T;
      var sWir = E.tasks('wirkung', 'Fragen zu den Texten', T.wirkung);
      var sec1 = E.section('Wie wirkt Strahlung auf den Körper?', [
        P('Lies die beiden Texte bei LEIFIphysik. Beantworte danach die Fragen.'),
        E.cards([
          [L.leifiIon, 'LEIFIphysik', 'Ionisierung durch Strahlung', 'Lies den Kasten und den Abschnitt „Ionisierung elektrisch neutraler Moleküle“.'],
          [L.leifiBio, 'LEIFIphysik', 'Biologische Strahlenwirkung', 'Lies den ganzen Artikel.']
        ]),
        sWir.el
      ]);
      var sDos = E.tasks('dosis', 'Natürliche Strahlenbelastung', KP.V.w8.dosis, {
        before: [KP.linkCard(L.bfsNatur, 'Bundesamt für Strahlenschutz', 'Natürliche Strahlung in Deutschland', 'Lies den Kasten am Anfang der Seite.'),
          h('p', { class: 'note' }, 'Die Dosis gibt man in Sievert (Sv) an. 1 Sv = 1000 mSv (Millisievert), 1 mSv = 1000 µSv (Mikrosievert).')]
      });
      var sRech = E.tasks('dosisleistung', 'Rechnen mit der Dosisleistung', KP.V.w8.dosisleistung, {
        before: [KP.linkCard(L.bfsMessen, 'Bundesamt für Strahlenschutz', 'Radioaktivität messen', 'Lies die Abschnitte „Dosisleistung“ und „Hinweise und Empfehlungen“.')]
      });
      var sec2 = E.section('Dosis im Alltag', [sDos.el, sRech.el]);

      var sRoe = E.tasks('roentgen', 'Fragen zu den Texten', T.roentgen, {
        before: [P('Röntgenstrahlung ist mit der Gammastrahlung eng verwandt, entsteht aber ganz anders: in einer Röntgenröhre. Lies die drei kurzen Texte und beantworte die Fragen.'),
          E.cards([
            [L.lhRoentgen, 'Lernhelfer (Duden)', 'Röntgenstrahlen', 'Lies die ersten beiden Absätze.'],
            [L.bfsRoentgen, 'Bundesamt für Strahlenschutz', 'Röntgenstrahlung', 'Lies die Textfassung des Videos.'],
            [L.bfsRoentgenFaq, 'Bundesamt für Strahlenschutz', 'Was versteht man unter Röntgenstrahlung?', 'Lies die Antwort.']
          ])]
      });
      var R = T.roehre, sol = {};
      R.zones.forEach(function (z) { sol[z] = R.a[z]; });
      var sRoehre = labelStep(E, 'roehre', 'Die Röntgenröhre beschriften', {
        chips: R.chips, zones: KP.ROEHRE_ZONES, figure: KP.figRoehre(), figClass: 'fig-roehre', sol: sol,
        before: [KP.linkCard(L.lhRoehre, 'Lernhelfer (Duden)', 'Röntgenröhre', 'Lies den Artikel und sieh dir die Abbildung genau an.'), P('Ziehe die Begriffe an die richtigen Stellen.')]
      });
      var sFun = E.tasks('funktion', 'So funktioniert die Röntgenröhre', T.funktion);
      var sec3 = E.section('Röntgenstrahlung', [sRoe.el, sRoehre.el, sFun.el]);

      var regRows = E.gen('regeln', KP.V.w8.regeln);
      var sReg = labelStep(E, 'regeln', 'Die fünf A des Strahlenschutzes', {
        chips: T.regeln.chips,
        rows: regRows.map(function (r, i) { return { id: 'r' + i, text: r.text }; }),
        sol: (function () { var m = {}; regRows.forEach(function (r, i) { m['r' + i] = r.a; }); return m; })(),
        before: [KP.linkCard(L.leifiSchutz, 'LEIFIphysik', 'Strahlenschutz', 'Lies den Kasten „Das Wichtigste auf einen Blick“ mit den fünf „A“.'),
          P('Ordne jeder Situation die passende Regel zu. Die Situationen stammen aus der Schule, aus der Medizin und aus der Technik.')]
      });
      var sec4 = E.section('Strahlenschutz', [sReg.el]);

      var sRadon = E.leifi('radon', {
        url: L.leifiRadon, title: 'Strahlenbelastung durch Radon',
        note: 'Für Teilaufgabe c) brauchst du: Alphastrahlung schädigt das Gewebe 20-mal so stark wie Gammastrahlung. Bei Alphastrahlung entspricht 1 Sv deshalb einer aufgenommenen Energie von nur 0,05 J pro Kilogramm Körpermasse.'
      }, { title: 'Strahlenbelastung durch Radon', optional: true, lockText: 'Gesperrt – löse zuerst die Zuordnung zum Strahlenschutz.' });
      var sec5 = E.section('Zusatzaufgabe (freiwillig)', [sRadon.el], 'sec-opt');
      var sLeifi = E.paper('leifi', KP.V.w8.final);
      var sec6 = E.section('Abschlussaufgabe', [sLeifi.el]);
      return E.mount(root, { intro: 'Warum ist ionisierende Strahlung gefährlich, wie viel Strahlung bekommst du im Alltag ab, und wie entsteht Röntgenstrahlung? Du liest bei LEIFIphysik, beim Bundesamt für Strahlenschutz und im Schülerlexikon nach und rechnest mit Dosisangaben.' },
        [sec1, sec2, sec3, sec4, sec5, sec6]);
    }
  });

  // =====================================================================
  // Woche 9: Kernspaltung, Kettenreaktion und Kernkraftwerk
  KP.defineWeek({
    n: 9,
    order: ['lesen', 'kette', 'kdeutung', 'sicherung', 'gleichungen', 'kkw', 'aufbau', 'energie', 'leifi'],
    optional: { haushalte: 'energie' },
    render: function (E, root) {
      var w = E.w, L = E.L, T = E.T;
      var sLes = E.tasks('lesen', 'Fragen zum Text', T.lesen);
      var sec1 = E.section('Einstieg: Kernspaltung', [
        P('Heute untersuchst du mit einer Simulation, was die Neutronen bewirken, die bei einer Kernspaltung frei werden. Lies vorher kurz nach, was bei einer Kernspaltung passiert. Beantworte danach die Fragen.'),
        E.cards([[L.lhSpaltung, 'Lernhelfer (Duden)', 'Kernspaltung', 'Lies nur die Einleitung und den Abschnitt „Kernspaltung – eine spezielle Form der Kernumwandlung“. Die anderen Abschnitte liest du später.']]),
        sLes.el
      ]);
      var kst = E.obj('sim', {});
      var kette = KP.Kette({ store: kst, settings: T.settings, onRun: function () { KP.save(); } });
      E.onDestroy(kette.destroy);
      var simLock = h('p', { class: 'lock-note' }, 'Die Simulation wird freigeschaltet, wenn du die Fragen zum Text richtig beantwortet hast.');
      E.onRefresh(function () { var open = E.isOpen('kette'); kette.setLocked(!open); simLock.hidden = open; });
      var tv = E.obj('tab', []);
      var grid = E.grid('kttab', T.settings, ['1', '2', '3', '4', '5'], tv, 'Generation');
      function rowFlags(s) {
        var runs = (kst.runs && kst.runs[s]) || [], best = [false, false, false, false, false], bn = -1;
        runs.forEach(function (run) {
          var f = run.map(function (v, g) { return C.parseNum(tv[s][g]) === v; }), n = f.filter(Boolean).length;
          if (n > bn) { bn = n; best = f; }
        });
        return best;
      }
      var sKette = E.step('kette', 'Spaltungen zählen', {
        body: [P('Starte die Kettenreaktion für jede Stellung der Steuerstäbe einmal. Trage für jede Stellung die Anzahl der Spaltungen in den Generationen 1 bis 5 ein.'), grid.el],
        lockText: 'Gesperrt – beantworte zuerst die Fragen zum Text.',
        check: function () { var f = [0, 1, 2].map(rowFlags); return { ok: f.every(C.all), marks: f }; },
        mark: function (m) { grid.mark(m); },
        lock: function (ro, done) { E.setInputs(grid.all(), ro, done); },
        solution: function () {
          return h('ul', null, T.settings.map(function (t, s) { var r = (kst.runs && kst.runs[s]) || []; r = r[r.length - 1]; return h('li', null, t + ': ' + (r ? r.join(' · ') : '–')); }));
        },
        fill: function () {
          if (!kst.runs) kst.runs = [[], [], []];
          [0, 1, 2].forEach(function (s) {
            var r = kst.runs[s][kst.runs[s].length - 1];
            if (!r) { r = KP.chainRun(s); kst.runs[s].push(r); }
            r.forEach(function (v, g) { grid.set(s, g, v); });
          });
        }
      });
      var sKd = E.tasks('kdeutung', 'Was zeigt die Simulation?', T.kdeutung);
      var sec2 = E.section('Simulation: Kettenreaktion', [
        P('Im Reaktorkern liegen viele Urankerne. Bei jeder Spaltung werden in dieser Simulation 3 Neutronen frei, die weitere Kerne spalten können. Die Steuerstäbe kannst du unterschiedlich weit einfahren. Jede Kettenreaktion beginnt mit 20 Spaltungen.'),
        simLock, kette.el, sKette.el, sKd.el
      ]);
      var sSich = E.tasks('sicherung', 'Vergleich mit dem Text', T.sicherung, {
        before: [KP.linkCard(L.lhSpaltung, 'Lernhelfer (Duden)', 'Kernspaltung', 'Lies jetzt den Abschnitt „Kettenreaktionen“.')]
      });
      var sec3 = E.section('Sicherung: Kettenreaktionen', [sSich.el]);
      var qGl = E.gen('gleichungen', KP.V.w9.gleichungen);
      var sGl = E.tasks('gleichungen', 'Spaltungsgleichungen', qGl, {
        before: [P('Bei der Spaltung bleibt die Summe der Massenzahlen und die Summe der Kernladungszahlen erhalten. Ergänze die Gleichungen. Die Kernladungszahlen findest du im Periodensystem.'), KP.pse(qGl.pse)]
      });
      var sec4 = E.section('Spaltungsgleichungen', [sGl.el]);

      var sKkw = E.tasks('kkw', 'Fragen zum Text', T.kkw, {
        before: [P('Im Kernkraftwerk läuft die Kettenreaktion gesteuert ab. Lies, wie ein Kernkraftwerk aufgebaut ist, und beantworte die Fragen.'),
          E.cards([[L.lhKKW, 'Lernhelfer (Duden)', 'Kernkraftwerk', 'Lies die Abschnitte „Aufbau und Arten von Kernkraftwerken“ und „Wirkungsweise eines Kernkraftwerkes“.']])]
      });
      var A = T.aufbau, sol = {};
      A.zones.forEach(function (z) { sol[z] = A.a[z]; });
      var sAuf = labelStep(E, 'aufbau', 'Ein Kernkraftwerk beschriften', {
        chips: A.chips, zones: KP.KKW_ZONES, figure: KP.figKKW(), figClass: 'fig-kkw', sol: sol,
        before: [P('Die Zeichnung zeigt ein Kernkraftwerk mit Druckwasserreaktor. Ziehe die Begriffe an die richtigen Stellen.')]
      });
      var sEn = E.tasks('energie', 'Energie und Wirkungsgrad', KP.V.w9.energie, {
        before: [KP.tip('Der Wirkungsgrad gibt an, welcher Anteil der Energie genutzt wird. Bei 35 % gilt: elektrische Leistung = 0,35 · Wärmeleistung. Kennst du die elektrische Leistung, teilst du durch 0,35.', L.serloProzent, 'Prozentrechnung')]
      });
      var sec5 = E.section('Das Kernkraftwerk', [sKkw.el, sAuf.el, sEn.el]);
      var sHh = E.tasks('haushalte', 'Wie viele Haushalte versorgt ein Kernkraftwerk?', KP.V.w9.haushalte, {
        optional: true, lockText: 'Gesperrt – löse zuerst die Aufgabe zu Energie und Wirkungsgrad.', okText: 'Richtig!'
      });
      var sec6 = E.section('Zusatzaufgabe (freiwillig)', [sHh.el], 'sec-opt');
      var sLeifi = E.paper('leifi', KP.V.w9.final);
      var sec7 = E.section('Abschlussaufgabe', [sLeifi.el]);
      return E.mount(root, { intro: 'Schwere Atomkerne lassen sich mit Neutronen spalten. Dabei werden neue Neutronen frei. Mit einer Simulation untersuchst du, was diese Neutronen bewirken können, und du lernst, wie ein Kernkraftwerk die Kettenreaktion nutzt.' },
        [sec1, sec2, sec3, sec4, sec5, sec6, sec7]);
    }
  });

  // =====================================================================
  // Woche 10: Kernfusion und Abschlussquiz
  KP.defineWeek({
    n: 10,
    order: ['lesen', 'gleichungen', 'vergleich', 'rechnen', 'leifi', 'runde1', 'runde2', 'runde3'],
    optional: { quiz: 'runde3' },
    render: function (E, root) {
      var L = E.L, T = E.T;
      var sLes = E.tasks('lesen', 'Fragen zu den Texten', T.lesen);
      var sec1 = E.section('Einstieg: das Feuer der Sonne', [
        P('Lies die beiden Texte. Beantworte danach die Fragen.'),
        E.cards([
          [L.lhFusion, 'Lernhelfer (Duden)', 'Kernfusion', 'Lies den ganzen Artikel.'],
          [L.ippFusion, 'Max-Planck-Institut für Plasmaphysik', 'Internationale ITER-Organisation gegründet', 'Lies nur den Abschnitt „Hintergrund: Energiequelle Fusion“.']
        ]),
        sLes.el
      ]);
      var sGl = E.tasks('gleichungen', 'Fusionsgleichungen', KP.V.w10.gleichungen, {
        before: [P('Auch bei der Fusion bleibt die Summe der Massenzahlen und die Summe der Kernladungszahlen erhalten.'), KP.pse([1, 2, 3])]
      });
      var sVer = E.tasks('vergleich', 'Fusion und Spaltung', T.vergleich);
      var sRech = E.tasks('rechnen', 'Rechnen mit Fusionsenergie', KP.V.w10.rechnen);
      var sec2 = E.section('Kernfusion verstehen', [sGl.el, sVer.el, sRech.el]);
      var sLeifi = E.paper('leifi', KP.V.w10.final, { okText: 'Erledigt! Jetzt fehlt nur noch das Abschlussquiz.' });
      var sec3 = E.section('Aufgabe auf Papier', [sLeifi.el]);

      var Q = E.gen('runden', KP.V.w10.runden);
      var r1 = E.tasks('runde1', 'Runde 1: Wochen 1 bis 3', Q.r1, { okText: 'Richtig! Runde 2 ist freigeschaltet.' });
      var r2 = E.tasks('runde2', 'Runde 2: Wochen 4 bis 6', Q.r2, { okText: 'Richtig! Runde 3 ist freigeschaltet.', before: [KP.pse(Q.pse2)] });
      var r3 = E.tasks('runde3', 'Runde 3: Wochen 7 bis 9', Q.r3, { okText: 'Richtig! Du hast die ganze Unterrichtsreihe geschafft.', before: [KP.pse(Q.pse3)] });
      var sec4 = E.section('Abschlussquiz', [
        P('Zum Schluss wiederholst du die ganze Unterrichtsreihe in drei Quizrunden. Jede Runde wiederholt drei Wochen. Wenn du nicht weiterweißt, schau in deinen Aufzeichnungen und auf den Seiten der Wochen nach.'),
        r1.el, r2.el, r3.el
      ]);
      var sQuiz = E.leifi('quiz', {
        url: L.leifiQuiz, title: 'Quiz zu ionisierender Strahlung', src: 'LEIFIphysik · Quiz',
        what: 'Löse das Quiz bei LEIFIphysik.',
        after: 'Klicke erst auf „Erledigt“, wenn du alle Fragen des Quiz beantwortet und deine Fehler nachvollzogen hast.',
        confirm: 'Hast du alle Fragen des Quiz beantwortet und deine Fehler nachvollzogen?'
      }, { title: 'Quiz bei LEIFIphysik', optional: true, lockText: 'Gesperrt – löse zuerst die drei Quizrunden.' });
      var sec5 = E.section('Zusatzaufgabe (freiwillig)', [sQuiz.el], 'sec-opt');
      return E.mount(root, { intro: 'Die Sonne gewinnt ihre Energie, indem leichte Atomkerne verschmelzen. Du liest nach, wie Kernfusion funktioniert, stellst Fusionsgleichungen auf und vergleichst Fusion und Spaltung. Zum Abschluss der Reihe wiederholst du alles in einem Quiz.' },
        [sec1, sec2, sec3, sec4, sec5]);
    }
  });
})();

</script>
<script>
// Anbindung an die Lernseiten-Datenbank: Schüler-Anmeldung, Speichern, Sitzung (ein Gerät je Name), Lehrerkonto
(function () {
  'use strict';
  var KP = window.KP, h = KP.h;
  var PID = 'kernphysik10';
  var DB = KP.db = { pid: PID, sid: null, bn: null, uid: null, status: 'start', meldung: '', offen: 0, fehler: false };
  var last = { json: {}, st: {} }, timers = [], abos = [], beobachtetBis = 0, letzterPuls = 0, selbst = false, anzeigen = [];
  var flush = Promise.resolve();
  // Hinweis aus dem letzten Neuladen (z. B. nach dem Abmelden des Lehrerkontos)
  try { DB.meldung = sessionStorage.getItem('ls.meldung') || ''; sessionStorage.removeItem('ls.meldung'); } catch (e) { /* ohne Sitzungsspeicher */ }

  function msg(t) { var e = new Error(t); e.lsText = t; return e; }
  function ort() { var s = location.hash.slice(1); return /^woche-\d{1,2}$/.test(s) ? s : 'start'; }
  function verwaist(se) {
    var t = LS.jetzt();
    return se.hg ? (se.akt || 0) < t - 960000 : (se.puls || 0) < t - 120000;
  }
  function abo(path, cb) {
    var ref = LS.ref(path);
    var f = ref.on('value', function (s) { cb(s.val()); }, function () { /* keine Berechtigung mehr */ });
    abos.push(function () { ref.off('value', f); });
  }
  function merkSchueler(on) {
    try {
      if (on) sessionStorage.setItem('ls.schueler', JSON.stringify({ sid: DB.sid, bn: DB.bn }));
      else sessionStorage.removeItem('ls.schueler');
    } catch (e) { /* ohne Sitzungsspeicher */ }
  }

  // Gab es in diesem Tab schon eine Anmeldung? Dann zuerst „Verbinde …“ zeigen.
  DB.erwartet = function () {
    try {
      if (sessionStorage.getItem('ls.schueler')) return true;
      for (var i = 0; i < sessionStorage.length; i++) if (/^firebase:authUser:/.test(sessionStorage.key(i))) return true;
    } catch (e) { /* egal */ }
    return false;
  };

  // ---------- Start: Lehrkraft oder Schüler aus diesem Tab wiederherstellen ----------
  DB.start = function () {
    DB.status = 'laden';
    var vorher = KP.mode;
    return LS.laden().then(function () { return LS.nutzer; }).then(function (u) {
      DB.status = 'bereit';
      if (LS.istLehrkraft(u)) { lehrerModus(); return; }
      var g = null;
      try { g = JSON.parse(sessionStorage.getItem('ls.schueler') || 'null'); } catch (e) { g = null; }
      if (g && u && u.isAnonymous) return wiederAnmelden(g, u);
      if (g) { merkSchueler(false); DB.meldung = 'Bitte melde dich neu an.'; }
    }).catch(function () { DB.status = 'fehler'; }).then(function () { return KP.mode !== vorher; });
  };

  // ---------- Lehrerkonto (Anmeldung in der Verwaltung) ----------
  function lehrerModus() {
    KP.mode = 'lehrer';
    KP.setTeacher(true);
    KP.tdata = {};
    LS.inaktiv.start({ frage: 'Bist du noch da?', abmelden: function () { DB.lehrerAbmelden('inaktiv'); } });
    LS.auth.onAuthStateChanged(function (u) { if (KP.mode === 'lehrer' && !LS.istLehrkraft(u)) DB.lehrerAbmelden('extern'); });
  }
  DB.lehrerAbmelden = function (grund) {
    if (KP.mode !== 'lehrer' || DB.status === 'abmelden') return Promise.resolve();
    DB.status = 'abmelden';
    LS.inaktiv.stop();
    if (KP.lehrerStop) KP.lehrerStop();
    try { sessionStorage.setItem('ls.meldung', grund === 'inaktiv' ? 'Du wurdest nach 16 Minuten ohne Eingabe abgemeldet.' : 'Du bist abgemeldet.'); } catch (e) { /* egal */ }
    // Danach neu laden: Die Seite arbeitet dann wieder mit der Geräte-Anmeldung für Schüler.
    return LS.abmelden().catch(function () { /* egal */ }).then(function () {
      try { history.replaceState(null, '', location.pathname + location.search + '#start'); } catch (e) { /* egal */ }
      location.reload();
    });
  };

  // ---------- Schüler-Anmeldung ----------
  DB.anmelden = function (eingabe) {
    var bn = String(eingabe || '').trim();
    if (!bn) return Promise.reject(msg('Bitte gib deinen Benutzernamen ein.'));
    if (DB.status === 'fehler') return Promise.reject(msg('Keine Verbindung zur Datenbank. Du kannst im Testmodus üben.'));
    var sid = null;
    return LS.laden().then(function () { return LS.geraet(); }).then(function (u) {
      DB.uid = u.uid;
      return LS.lesen('namen/' + LS.namen.schluessel(bn));
    }).then(function (n) {
      if (!n) throw msg('Diesen Benutzernamen gibt es nicht.');
      if (n.bn !== bn) throw msg('Achte auf Groß- und Kleinschreibung.');
      sid = n.sid;
      return LS.lesen('freigabe/' + PID + '/' + sid);
    }).then(function (f) {
      if (f !== true) throw msg('Kernphysik ist für dich noch nicht freigeschaltet. Frag deine Lehrkraft.');
      return LS.lesen('sperren/' + sid + '/' + DB.uid);
    }).then(function (sp) {
      if (sp && sp > LS.jetzt()) throw msg('Deine Lehrkraft hat dich gerade abgemeldet. In zwei Minuten kannst du dich auf diesem Gerät wieder anmelden.');
      return LS.lesen('sitzungen/' + sid);
    }).then(function (se) {
      if (se && se.uid !== DB.uid && !verwaist(se)) throw msg('Dieser Name ist gerade auf einem anderen Gerät angemeldet.');
      return LS.ref('sitzungen/' + sid).set({ uid: DB.uid, projekt: PID, seit: LS.TS, puls: LS.TS, akt: LS.TS, hg: false, ort: ort() });
    }).then(function () {
      DB.sid = sid;
      DB.bn = bn;
      return datenLaden();
    }).then(aktivieren).catch(function (e) {
      if (DB.sid && KP.mode !== 'schueler') { LS.ref('sitzungen/' + DB.sid).remove().catch(function () {}); }
      if (KP.mode !== 'schueler') { DB.sid = null; DB.bn = null; }
      if (e.lsText) throw e;
      var code = String((e && (e.code || e.message)) || '');
      if (/network|zeit|laden/i.test(code)) throw msg('Keine Verbindung zur Datenbank.');
      if (/operation-not-allowed|admin-restricted-operation|unauthorized-domain|too-many-requests/.test(code)) throw msg(LS.fehlertext(e));
      throw msg('Die Anmeldung hat nicht geklappt' + (e && e.code ? ' (' + e.code + ')' : '') + '. Versuche es noch einmal.');
    });
  };
  function wiederAnmelden(g, u) {
    DB.uid = u.uid;
    return LS.lesen('sitzungen/' + g.sid).then(function (se) {
      if (!se || se.uid !== u.uid) throw msg('Du wurdest abgemeldet. Melde dich neu an.');
      DB.sid = g.sid;
      DB.bn = g.bn;
      return LS.ref('sitzungen/' + g.sid).update({ puls: LS.TS, hg: false, ort: ort(), akt: LS.TS });
    }).then(datenLaden).then(aktivieren).catch(function (e) {
      merkSchueler(false);
      DB.sid = null;
      DB.bn = null;
      DB.meldung = e.lsText || 'Bitte melde dich neu an.';
    });
  }
  function datenLaden() {
    var base = PID + '/' + DB.sid;
    return Promise.all([LS.lesen('daten/' + base), LS.lesen('status/' + base)]).then(function (r) {
      var daten = r[0] || {}, status = r[1] || {};
      var d = { weeks: {} };
      last = { json: {}, st: {} };
      Object.keys(daten).forEach(function (k) {
        var m = /^w(\d+)$/.exec(k);
        if (!m) return;
        try { d.weeks[m[1]] = JSON.parse(daten[k]); last.json[m[1]] = daten[k]; } catch (e) { /* kaputt: neu */ }
      });
      // Fortschritt geht nur nach vorn: was als gelöst gemeldet ist, bleibt gelöst
      Object.keys(status).forEach(function (wk) {
        var n = wk.slice(1), w = d.weeks[n] = d.weeks[n] || {};
        w.solved = w.solved || {}; w.tries = w.tries || {}; w.ans = w.ans || {};
        Object.keys(status[wk] || {}).forEach(function (id) {
          var s = status[wk][id] || {};
          if (s.g && !w.solved[id]) w.solved[id] = 1;
          var t = (s.f || 0) + (s.g ? 1 : 0);
          if ((w.tries[id] || 0) < t) w.tries[id] = t;
          last.st[n + '/' + id] = { g: !!s.g, f: s.f || 0 };
        });
        if (JSON.stringify(w) !== last.json[n]) last.json[n] = null;
      });
      if (daten.seed) d.seed = daten.seed;
      KP.data = d;
      // Anmeldung zählt als Aktivität („Zuletzt aktiv“ in der Übersicht)
      LS.ref('zuletzt/' + base).set(LS.TS).catch(function () { /* nicht schlimm */ });
      if (!d.seed) {
        d.seed = Math.floor(Math.random() * 1e9).toString(36) + Date.now().toString(36);
        return LS.ref('daten/' + base + '/seed').set(d.seed);
      }
    });
  }
  function aktivieren() {
    KP.mode = 'schueler';
    KP.setTeacher(false);
    DB.meldung = '';
    DB.fehler = false;
    selbst = false;
    merkSchueler(true);
    abo('sitzungen/' + DB.sid, function (v) {
      if (KP.mode !== 'schueler' || selbst) return;
      if (!v || v.uid !== DB.uid) weg(v ? 'anderes' : 'lehrkraft');
    });
    abo('beobachtet/' + DB.sid, function (v) { beobachtetBis = v || 0; if (beobachtetBis > LS.jetzt()) puls(); });
    timers.push(setInterval(takt, 1000));
    LS.inaktiv.start({ frage: 'Bist du noch ' + DB.bn + '?', abmelden: function () { DB.abmelden('inaktiv'); }, weiter: function () { puls(); } });
    document.addEventListener('visibilitychange', sichtbar);
    anzeige();
  }

  // ---------- Lebenszeichen ----------
  function takt() {
    if (KP.mode !== 'schueler') return;
    if (beobachtetBis > LS.jetzt() || Date.now() - letzterPuls >= 30000) puls();
  }
  function puls() {
    if (KP.mode !== 'schueler' || !DB.sid || beendet) return Promise.resolve();
    letzterPuls = Date.now();
    hgGemeldet = !!document.hidden && !beendet;
    return LS.ref('sitzungen/' + DB.sid).update({ puls: LS.TS, hg: hgGemeldet, ort: ort(), akt: Math.round(LS.inaktiv.letzte() + LS.offset) })
      .catch(function () { /* Sitzung weg: das Abo meldet ab */ });
  }
  // Tab geschlossen oder Seite verlassen: nicht als „Hintergrund“ melden. Der Name wird dann nach 2 Minuten frei.
  var beendet = false, hgGemeldet = false;
  window.addEventListener('pagehide', function (e) {
    if (KP.mode !== 'schueler' || e.persisted) return;
    beendet = true;
    if (hgGemeldet && DB.sid) LS.ref('sitzungen/' + DB.sid).update({ puls: LS.TS, hg: false }).catch(function () {});
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted && KP.mode === 'schueler') { beendet = false; puls(); } });
  function sichtbar() {
    if (KP.mode !== 'schueler' || beendet) return;
    if (!document.hidden && (Date.now() - LS.inaktiv.letzte()) * LS.zeit >= LS.IDLE + LS.GRACE) { DB.abmelden('inaktiv'); return; }
    puls();
  }
  DB.ortGeaendert = function () { if (KP.mode === 'schueler') puls(); };

  // ---------- Speichern ----------
  function statusVon(n, w) {
    var def = KP.WEEKS[n];
    if (!def || !w) return {};
    var ids = def.order.concat(Object.keys(def.optional || {})), out = {};
    ids.forEach(function (id) {
      var g = !!(w.solved && w.solved[id]), t = (w.tries && w.tries[id]) || 0;
      if (!g && !t) return;
      out[id] = { g: g, f: Math.max(0, t - (g ? 1 : 0)) };
    });
    return out;
  }
  DB.statusVon = statusVon;
  DB.speichern = function () {
    if (KP.mode !== 'schueler' || !DB.sid) return flush;
    var upd = {}, any = false, weeks = (KP.data && KP.data.weeks) || {}, base = PID + '/' + DB.sid;
    Object.keys(weeks).forEach(function (n) {
      var w = weeks[n], j = JSON.stringify(w);
      if (j !== last.json[n]) { upd['daten/' + base + '/w' + n] = j; last.json[n] = j; any = true; }
      var st = statusVon(+n, w);
      Object.keys(st).forEach(function (id) {
        var v = st[id], k = n + '/' + id, o = last.st[k];
        if (o) {
          if (o.g && !v.g) v.g = true;
          if (v.f < o.f) v.f = o.f;
          if (o.g === v.g && o.f === v.f) return;
        }
        upd['status/' + base + '/w' + n + '/' + id] = v;
        last.st[k] = v;
        any = true;
      });
    });
    if (!any) return flush;
    upd['zuletzt/' + base] = LS.TS;
    DB.offen++;
    anzeige();
    var p = LS.ref('').update(upd).then(function () { DB.fehler = false; }).catch(function () {
      DB.fehler = KP.mode === 'schueler';
      Object.keys(upd).forEach(function (k) {
        var m = /^daten\/[^/]+\/[^/]+\/w(\d+)$/.exec(k);
        if (m) last.json[m[1]] = null;
        var m2 = /^status\/[^/]+\/[^/]+\/w(\d+)\/([^/]+)$/.exec(k);
        if (m2) delete last.st[m2[1] + '/' + m2[2]];
      });
    }).then(function () { DB.offen--; anzeige(); });
    flush = flush.then(function () { return p; });
    return p;
  };

  // ---------- Abmelden ----------
  function aufraeumen() {
    timers.forEach(clearInterval);
    timers = [];
    abos.forEach(function (f) { f(); });
    abos = [];
    LS.inaktiv.stop();
    document.removeEventListener('visibilitychange', sichtbar);
    merkSchueler(false);
    KP.mode = 'test';
    DB.sid = null;
    DB.bn = null;
    DB.offen = 0;
    DB.fehler = false;
    beobachtetBis = 0;
    last = { json: {}, st: {} };
    KP.data = KP.ladeLokal();
  }
  function zurStart() {
    if (location.hash !== '#start') location.hash = '#start'; else KP.route();
  }
  function weg(grund) {
    aufraeumen();

    [['α', 402, 44], ['β', 438, 167], ['γ', 430, 262]].forEach(function (l) {
      var t = S('text', { x: l[1], y: l[2], class: 'h-label' });
      t.textContent = l[0];
      if (l[0] === 'β') {
        var sup = S('tspan', { dy: -12, class: 'h-sup' });
        sup.textContent = '−';
        t.appendChild(sup);
      }
      svg.appendChild(t);
    });
    return svg;
  }
  function brandIcon() {
    var svg = S('svg', { class: 'brand-icon', viewBox: '0 0 40 40', 'aria-hidden': 'true' });
    svg.appendChild(S('circle', { cx: 20, cy: 20, r: 19, class: 'bi-bg' }));
    svg.appendChild(trefoil(20, 20, 3.4, 'bi-tre'));
    return svg;
  }

  // ---------- Startseite ----------
  function loginArea() {
    var DB = KP.db;
    var note = h('p', { class: 'login-note', id: 'login-note', role: 'status', 'aria-live': 'polite' }, DB.meldung || '');
    if (DB.meldung) note.className = 'login-note info-note';
    if (KP.mode === 'lehrer') {
      var ab = h('button', { type: 'button', class: 'btn small', id: 'lehrer-abmelden' }, 'Abmelden');
      ab.addEventListener('click', function () { DB.lehrerAbmelden('selbst'); });
      return h('div', { class: 'login' }, KP.modeChip(),
        h('a', { class: 'btn small primary', href: '#uebersicht', id: 'zur-uebersicht' }, 'Übersicht'),
        h('a', { class: 'btn small ghost', href: '../verwaltung/#start', id: 'zur-verwaltung' }, 'Verwaltung'), ab);
    }
    if (KP.mode === 'schueler') {
      var out = h('button', { type: 'button', class: 'btn small', id: 'logout-btn' }, 'Abmelden');
      out.addEventListener('click', function () { out.disabled = true; DB.abmelden('selbst'); });
      return h('div', { class: 'login' }, h('span', { class: 'login-as' }, 'Angemeldet als'), KP.modeChip(), DB.speicherAnzeige(), out);
    }
    var nameIn = h('input', {
      type: 'text', id: 'login-name', class: 'login-in', placeholder: 'Benutzername',
      autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-label': 'Benutzername'
    });
    var loginBtn = h('button', { type: 'button', class: 'btn primary', id: 'login-btn' }, 'Anmelden');
    function login() {
      DB.meldung = '';
      note.className = 'login-note';
      note.textContent = 'Melde an …';
      loginBtn.disabled = true;
      DB.anmelden(nameIn.value).then(function () {
        if (location.hash !== '#start') location.hash = '#start'; else route();
      }).catch(function (e) {
        loginBtn.disabled = false;
        note.className = 'login-note bad';
        note.textContent = e.lsText || 'Die Anmeldung hat nicht geklappt.';
      });
    }
    loginBtn.addEventListener('click', login);
    nameIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
    KP.startStatus = function () {
      if (!document.body.contains(note)) return;
      if (DB.status === 'fehler') { note.className = 'login-note bad'; note.textContent = 'Keine Verbindung zur Datenbank. Du kannst im Testmodus üben.'; }
      else if (DB.meldung && !note.textContent) { note.className = 'login-note info-note'; note.textContent = DB.meldung; }
    };
    setTimeout(KP.startStatus, 0);
    return h('div', { class: 'login' }, h('div', { class: 'login-field' }, nameIn), loginBtn, KP.modeChip(), note);
  }
  function renderStart() {
    var top = h('header', { class: 'topbar start-bar' },
      h('a', { class: 'brand', href: '#start' }, brandIcon(), h('span', null, D.meta.title)),
      loginArea());

    var hero = h('section', { class: 'hero' }, h('div', { class: 'hero-in' },
      h('div', { class: 'hero-text' },
        h('h1', { class: 'hero-title' }, 'Kernphysik'),
        h('p', { class: 'hero-sub' }, 'Physik · Jahrgangsstufe 10'),
        h('p', { class: 'hero-lead' }, 'Lesen, messen, auswerten, üben – eine Woche nach der anderen.')),
      heroArt()));

    var info = h('div', { class: 'info', id: 'start-info' },
      KP.mode === 'lehrer'
        ? [h('p', null, h('strong', null, 'Lehrerkonto: '), 'Alle Aufgaben sind freigeschaltet, Lösungen lassen sich anzeigen und einsetzen. Es wird nichts gespeichert.'),
          h('p', null, h('a', { class: 'btn small primary', href: '#uebersicht' }, 'Zur Übersicht der Lerngruppen'))]
        : KP.mode === 'schueler'
          ? [h('p', null, h('strong', null, 'Angemeldet als ' + KP.db.bn + ': '), 'Dein Fortschritt wird gespeichert. Du kannst auf jedem Gerät weiterarbeiten.'),
            h('p', null, 'Deine Lehrkraft sieht deinen Fortschritt und deine Eingaben, auch live. Wenn du fertig bist, tippe oben auf „Abmelden“.')]
          : [h('p', null, h('strong', null, 'Testmodus: '), 'Dein Fortschritt wird nur in diesem Browser auf diesem Gerät gespeichert. Melde dich oben mit deinem Benutzernamen an, dann wird er gespeichert.'),
            h('p', null, 'Nach der Anmeldung sieht deine Lehrkraft deinen Fortschritt und deine Eingaben, auch live.'),
            !KP.storageOk ? h('p', { class: 'warn' }, 'Dieser Browser erlaubt kein Speichern. Dein Fortschritt geht beim Schließen der Seite verloren.') : null]);

    var grid = h('div', { class: 'wgrid' }, D.weeks.map(function (wk) {
      var p = KP.weekProgress(wk.n);
      var state = p.done === 0 ? 'new' : p.done >= p.total ? 'done' : 'part';
      var status = state === 'new' ? 'Noch nicht begonnen' : state === 'done' ? 'Erledigt' : p.done + ' von ' + p.total + ' Aufgaben';
      return h('a', { class: 'wcard ' + state, href: '#woche-' + wk.n, id: 'wcard-' + wk.n },
        h('span', { class: 'wc-top' }, h('span', { class: 'wc-n' }, 'Woche ' + wk.n), wk.tag ? h('span', { class: 'wc-tag' }, wk.tag) : null),
        h('span', { class: 'wc-t' }, wk.title),
        h('span', { class: 'wc-bar' }, h('span', { style: 'width:' + (100 * p.done / p.total).toFixed(1) + '%' })),
        h('span', { class: 'wc-s' }, status));
    }));

    app.appendChild(top);
    app.appendChild(hero);
    app.appendChild(h('main', { class: 'start' }, info, h('h2', { class: 'start-h' }, 'Wochen'), grid,
      h('p', { class: 'start-foot' }, 'Texte und Aufgaben: LEIFIphysik, Lernhelfer (Duden), Bundesamt für Strahlenschutz, Max-Planck-Institut für Plasmaphysik, IQB · Mathe-Tipps: Serlo')));
    return null;
  }

  // ---------- Live-Ansicht im eingebetteten Rahmen (nur Anzeige, nichts speichern) ----------
  function ansichtModus() {
    KP.mode = 'ansicht';
    KP.teacher = false;
    document.body.classList.add('ansicht');
    app.textContent = '';
    app.appendChild(h('p', { class: 'live-wait' }, 'Warte auf Daten …'));
    var lastN = null;
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin || e.source !== window.parent) return;
      var m = e.data;
      if (!m || m.typ !== 'zeige') return;
      var wk = weekByN(+m.n);
      if (!wk) return;
      var y = lastN === m.n ? window.scrollY : 0;
      lastN = m.n;
      KP.data = { seed: m.seed || 'ohne', weeks: {} };
      KP.data.weeks[m.n] = m.week || {};
      if (cleanup) { try { cleanup(); } catch (x) { /* egal */ } cleanup = null; }
      app.textContent = '';
      cleanup = KP.renderWeek(app, wk);
      window.scrollTo(0, y);
    });
    window.parent.postMessage({ typ: 'bereit' }, location.origin);
  }

  // ---------- Navigation ----------
  function route() {
    if (KP.mode === 'ansicht') return;
    if (cleanup) { try { cleanup(); } catch (e) { /* egal */ } cleanup = null; }
    if (KP.liveZu) KP.liveZu();
    var name = '';
    try { name = decodeURIComponent(location.hash.slice(1)); } catch (e) { name = location.hash.slice(1); }
    var m = /^woche-(\d{1,2})$/.exec(name);
    var wk = m ? weekByN(+m[1]) : null;
    var ov = /^uebersicht(?:-s-(.+))?$/.exec(name);
    KP.symbar.hide();
    app.textContent = '';
    document.body.classList.toggle('is-teacher', KP.teacher);
    if (ov && KP.mode === 'lehrer') {
      cleanup = KP.renderUebersicht(app, ov[1] || null);
      document.title = 'Übersicht · ' + D.meta.title;
    } else if (wk) {
      cleanup = KP.renderWeek(app, wk);
      document.title = 'Woche ' + wk.n + ': ' + wk.title + ' · ' + D.meta.title;
    } else {
      cleanup = renderStart();
      document.title = D.meta.longTitle;
    }
    window.scrollTo(0, 0);
    if (KP.db && KP.db.ortGeaendert) KP.db.ortGeaendert();
  }
  KP.route = route;
  function renderLaden() {
    app.textContent = '';
    app.appendChild(h('header', { class: 'topbar start-bar' }, h('a', { class: 'brand', href: '#start' }, brandIcon(), h('span', null, D.meta.title))));
    app.appendChild(h('main', { class: 'start' }, h('p', { class: 'loading', id: 'verbinde' }, 'Verbinde mit der Datenbank …')));
  }
  if (window.self !== window.top && location.hash === '#live') { ansichtModus(); return; }
  window.addEventListener('hashchange', route);
  if (KP.db.erwartet()) {
    renderLaden();
    KP.db.start().then(route);
  } else {
    route();
    KP.db.start().then(function (geaendert) { if (geaendert) route(); else if (KP.startStatus) KP.startStatus(); });
  }
})();

</script>
</body>
</html>
