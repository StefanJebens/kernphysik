<script>
// Zusatz: Strahlen fliegen in alle Raumrichtungen – zwei gleich große Fenster in 10 cm und 20 cm Abstand
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, S = KP.svg;
  var DA = 10, DB = 20, HALF = 2;   // Abstände der Fenster und halbe Kantenlänge in cm
  var RATE = 2500;                   // Strahlen pro Sekunde
  var MAXN = 100000;
  var VIEW = 24;                     // Draufsicht: -24 … 24 cm

  function dir() {
    var z = 2 * Math.random() - 1, p = 2 * Math.PI * Math.random(), s = Math.sqrt(1 - z * z);
    return [s * Math.cos(p), s * Math.sin(p), z];
  }

  KP.Kugel = function () {
    var n = 0, hitA = 0, hitB = 0, running = false, raf = 0, last = 0, acc = 0;
    var rays = [];

    // Draufsicht
    var top = S('svg', { class: 'k-top', viewBox: (-VIEW) + ' ' + (-VIEW) + ' ' + (2 * VIEW) + ' ' + (2 * VIEW), role: 'img', 'aria-label': 'Draufsicht: Präparat in der Mitte, Fenster A rechts in 10 cm, Fenster B links in 20 cm Abstand' });
    top.appendChild(S('circle', { cx: 0, cy: 0, r: DA, class: 'k-ring' }));
    top.appendChild(S('circle', { cx: 0, cy: 0, r: DB, class: 'k-ring' }));
    var rayG = S('g', { class: 'k-rays' });
    top.appendChild(rayG);
    top.appendChild(S('line', { x1: DA, x2: DA, y1: -HALF, y2: HALF, class: 'k-win' }));
    top.appendChild(S('line', { x1: -DB, x2: -DB, y1: -HALF, y2: HALF, class: 'k-win' }));
    top.appendChild(S('circle', { cx: 0, cy: 0, r: 0.9, class: 'k-src' }));
    function label(x, y, t, anchor) {
      var e = S('text', { x: x, y: y, class: 'k-lab', 'text-anchor': anchor || 'middle' });
      e.textContent = t;
      top.appendChild(e);
    }
    label(DA, -HALF - 1.2, 'A');
    label(-DB, -HALF - 1.2, 'B');
    label(0, 3.4, 'Präparat');
    label(DA * 0.7071 + 0.6, DA * 0.7071 + 1.6, '10 cm', 'start');
    label(DB * 0.7071 + 0.4, DB * 0.7071 + 1.2, '20 cm', 'start');

    // Fensteransichten
    function panel(name, dist) {
      var svg = S('svg', { class: 'k-face', viewBox: '-2.3 -2.3 4.6 4.6', role: 'img', 'aria-label': 'Fenster ' + name + ' von vorne gesehen' });
      svg.appendChild(S('rect', { x: -HALF, y: -HALF, width: 2 * HALF, height: 2 * HALF, class: 'k-face-bg' }));
      var dots = S('g', { class: 'k-dots' });
      svg.appendChild(dots);
      var cnt = h('span', { class: 'k-cnt', id: 'k-cnt-' + name.toLowerCase() }, '0');
      var box = h('div', { class: 'k-panel' },
        h('div', { class: 'k-ph' }, 'Fenster ' + name, h('small', null, dist + ' cm Abstand')),
        svg,
        h('div', { class: 'k-hits' }, 'Treffer: ', cnt));
      return { box: box, dots: dots, cnt: cnt };
    }
    var pA = panel('A', DA), pB = panel('B', DB);
    var nOut = h('span', { id: 'k-n' }, '0');
    var bStart = h('button', { type: 'button', class: 'btn primary', id: 'k-start' }, 'Start');
    var bReset = h('button', { type: 'button', class: 'btn ghost', id: 'k-reset' }, 'Zurücksetzen');
    var el = h('div', { class: 'kugel' },
      h('div', { class: 'k-left' }, top,
        h('p', { class: 'k-cap' }, 'Draufsicht. Die Strahlen fliegen in alle Richtungen des Raums, also auch schräg nach oben und unten.')),
      h('div', { class: 'k-right' },
        h('div', { class: 'k-panels' }, pA.box, pB.box),
        h('p', { class: 'k-total' }, 'Ausgesandte Strahlen: ', nOut),
        h('div', { class: 'k-ctl' }, bStart, bReset)));

    function addDot(p, y, z) {
      p.dots.appendChild(S('circle', { cx: y.toFixed(3), cy: (-z).toFixed(3), r: 0.07, class: 'k-dot' }));
    }
    function emit(count, now) {
      var show = 0;
      for (var i = 0; i < count && n < MAXN; i++) {
        n++;
        var d = dir(), t, y, z, hit = '';
        if (d[0] > 0) {
          t = DA / d[0]; y = t * d[1]; z = t * d[2];
          if (Math.abs(y) <= HALF && Math.abs(z) <= HALF) { hit = 'A'; hitA++; addDot(pA, y, z); }
        } else if (d[0] < 0) {
          t = -DB / d[0]; y = t * d[1]; z = t * d[2];
          if (Math.abs(y) <= HALF && Math.abs(z) <= HALF) { hit = 'B'; hitB++; addDot(pB, y, z); }
        }
        var L = hit ? t : VIEW * 1.5;
        if (hit || show < 2) {
          if (!hit) show++;
          rays.push({ x: L * d[0], y: L * d[1], hit: hit, born: now });
        }
      }
    }
    function drawRays(now) {
      rays = rays.filter(function (r) { return now - r.born < (r.hit ? 500 : 260); });
      while (rayG.firstChild) rayG.removeChild(rayG.firstChild);
      rays.forEach(function (r) {
        rayG.appendChild(S('line', { x1: 0, y1: 0, x2: r.x.toFixed(2), y2: r.y.toFixed(2), class: r.hit ? 'k-ray hit' : 'k-ray' }));
      });
    }
    function show() {
      nOut.textContent = String(n);
      pA.cnt.textContent = String(hitA);
      pB.cnt.textContent = String(hitB);
      bStart.textContent = running ? 'Stopp' : (n > 0 && n < MAXN ? 'Weiter' : 'Start');
      bStart.disabled = n >= MAXN;
    }
    function loop(now) {
      var dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
      last = now;
      acc += dt * RATE * (KP.debugTime || 1);
      var k = Math.floor(acc);
      acc -= k;
      emit(k, now);
      drawRays(now);
      if (n >= MAXN) running = false;
      show();
      if (running) raf = requestAnimationFrame(loop);
      else { raf = 0; setTimeout(function () { drawRays(performance.now() + 1000); }, 600); }
    }
    bStart.addEventListener('click', function () {
      if (running) { running = false; return; }
      if (n >= MAXN) return;
      running = true;
      last = performance.now();
      raf = requestAnimationFrame(loop);
      show();
    });
    bReset.addEventListener('click', function () {
      running = false;
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      n = hitA = hitB = 0;
      acc = 0;
      rays = [];
      while (pA.dots.firstChild) pA.dots.removeChild(pA.dots.firstChild);
      while (pB.dots.firstChild) pB.dots.removeChild(pB.dots.firstChild);
      drawRays(performance.now());
      show();
    });
    show();
    return {
      el: el,
      stats: function () { return { n: n, a: hitA, b: hitB }; },
      destroy: function () { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
    };
  };
})();

</script>
<script>
// Baukasten für alle Wochen: Schritte mit Prüfen-Knopf, Aufgabenarten, Abschnitte, Tabellen, Diagramme
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, C = KP.C;
  var OK_TEXT = 'Richtig! Die nächste Aufgabe ist freigeschaltet.';
  var BAD_TEXT = 'Noch nicht ganz richtig. Die rot markierten Stellen stimmen nicht.';
  KP.WEEKS = KP.WEEKS || {};
  KP.TITEL = KP.TITEL || {};   // Aufgabentitel je Woche (für die Lehrerübersicht)
  KP.defineWeek = function (def) { KP.WEEKS[def.n] = def; };
  function blank(n) { var a = []; for (var i = 0; i < n; i++) a.push(''); return a; }
  KP.blank = blank;
  function P(t) { return h('p', null, KP.rich(t)); }
  KP.P = P;

  KP.Engine = function (wk, def) {
    var E = {};
    var w = KP.week(wk.n), A = w.ans;
    var ORDER = def.order, OPT = def.optional || {};
    var steps = [], refreshers = [], destroyers = [], secN = 0;
    E.wk = wk; E.w = w; E.A = A; E.L = KP.DATA.links; E.T = KP.DATA['w' + wk.n] || {};
    E.obj = function (k, d) { if (A[k] == null) A[k] = d; return A[k]; };
    E.solved = function (id) { return !!w.solved[id]; };
    E.isOpen = function (id) {
      if (KP.teacher) return true;
      if (OPT[id]) return E.solved(OPT[id]);
      var i = ORDER.indexOf(id);
      return i <= 0 || E.solved(ORDER[i - 1]);
    };
    E.active = function (id) { return E.isOpen(id) && !E.solved(id); };
    E.visible = function (id) { return E.isOpen(id) || E.solved(id); };
    E.onRefresh = function (f) { refreshers.push(f); };
    E.onDestroy = function (f) { destroyers.push(f); };
    E.num = function (x, dec) { return KP.fmt(x, dec == null ? 1 : dec); };

    // ---------- Eingabe-Helfer ----------
    E.bindNum = function (id, store, key, label) {
      var inp = KP.numInput(id, store[key]);
      if (label) inp.setAttribute('aria-label', label);
      inp.addEventListener('input', function () { store[key] = inp.value; inp.classList.remove('bad'); KP.save(); });

    };

      if (label) inp.setAttribute('aria-label', label);
      inp.addEventListener('input', function () { store[key] = inp.value; inp.classList.remove('bad'); KP.save(); });
      return inp;
    };
    E.setInputs = function (list, ro, done) {
      list.forEach(function (inp) {

    };
    E.markList = function (list, flags) {
      list.forEach(function (inp, i) { inp.classList.toggle('bad', !!flags && flags[i] === false); });
    };
    E.put = function (inp, store, key, val) { store[key] = val; inp.value = val; inp.classList.remove('bad'); };

    // ---------- Zufallsvarianten ----------
    // E.rng(key): eigener Zufallsgenerator je Schüler, Woche und Schlüssel
    E.rng = function (key) { return KP.rng('w' + wk.n + ':' + key); };
    // E.gen(id, fn): Aufgaben mit eigenen Zahlen erzeugen (fn bekommt Zufallsgenerator und Engine)
    // E.Q: Fragen je Schritt, E.G: erzeugte Varianten (für Lehrkraft-Werkzeuge und Tests)
    E.Q = {}; E.G = {};
    E.gen = function (id, fn) { var r = typeof fn === 'function' ? fn(E.rng(id), E) : fn; E.G[id] = r; return r; };

    // ---------- Aufgabenblock: Auswahl, Zahl, Bruch, Zehnerpotenz, Kern ----------
    // Die Antwortmöglichkeiten erscheinen für jeden Schüler in eigener Reihenfolge (außer bei q.fix).
    // Gespeichert wird immer die Nummer der Antwort in der ursprünglichen Liste.
    E.taskBlock = function (id, qs, store) {
      var R = E.rng(id + ':mc');
      var items = qs.map(function (q, i) {
        var qn = h('span', { class: 'qn' }, (i + 1) + '.');
        if (q.o) {
          var radios = [], labels = [];
          var fs = h('fieldset', { class: 'mc', id: id + '-' + i }, h('legend', null, qn, ' ', KP.rich(q.q)));
          var order = R.perm(q.o.length);
          if (q.fix) order = order.map(function (x, k) { return k; });
          q.o.forEach(function (o, j) {
            var r = h('input', { type: 'radio', name: id + '-' + i, value: String(j), id: id + '-' + i + '-' + j });
            if (store[i] === j) r.checked = true;
            r.addEventListener('change', function () {
              store[i] = j;
              fs.classList.remove('bad');
              labels.forEach(function (lb) { lb.classList.remove('bad'); });
              KP.save();
            });
            var lb = h('label', { class: 'opt', for: r.id }, r, h('span', null, KP.rich(o)));
            radios.push(r);
            labels.push(lb);
          });
          order.forEach(function (j) { fs.appendChild(labels[j]); });
          return { kind: 'mc', el: fs, fs: fs, radios: radios, labels: labels };
        }
        var head = h('p', { class: 'nq' }, qn, ' ', KP.rich(q.q));
        if (q.nuc) {
          if (!Array.isArray(store[i])) store[i] = ['', '', ''];
          var ni = KP.nucInput(id + '-' + i, store[i], function () { KP.save(); });
          return { kind: 'nuc', ni: ni, inputs: ni.inputs, el: h('div', { class: 'ntask' }, head,
            h('div', { class: 'ans-line eq-line' }, q.pre ? h('span', { class: 'pre' }, KP.rich(q.pre)) : null, ni.el, q.post ? h('span', { class: 'post' }, KP.rich(q.post)) : null)) };
        }
        if (q.sci) {
          if (!Array.isArray(store[i])) store[i] = ['', ''];
          var arr = store[i];
          var im = KP.numInput(id + '-' + i + '-m', arr[0]), ie = KP.numInput(id + '-' + i + '-e', arr[1], 'expo');
          im.setAttribute('aria-label', 'Zahl vor der Zehnerpotenz');
          ie.setAttribute('aria-label', 'Hochzahl');
          im.addEventListener('input', function () { arr[0] = im.value; im.classList.remove('bad'); ie.classList.remove('bad'); KP.save(); });
          ie.addEventListener('input', function () { arr[1] = ie.value; im.classList.remove('bad'); ie.classList.remove('bad'); KP.save(); });
          return { kind: 'sci', inputs: [im, ie], el: h('div', { class: 'ntask' }, head,
            h('div', { class: 'ans-line' }, q.pre ? h('span', { class: 'pre' }, KP.rich(q.pre)) : null, im,
              h('span', { class: 'times' }, '· 10'), h('span', { class: 'sup-wrap' }, ie), q.unit ? h('span', { class: 'unit' }, q.unit) : null)) };
        }
        var inp = KP.numInput(id + '-' + i, store[i]);
        inp.setAttribute('aria-label', 'Antwort zu Frage ' + (i + 1));
        inp.addEventListener('input', function () { store[i] = inp.value; inp.classList.remove('bad'); KP.save(); });
        var line = q.frac
          ? h('div', { class: 'ans-line' }, h('span', { class: 'pre' }, KP.rich(q.pre || 'auf')),
            h('span', { class: 'frac' }, h('span', { class: 'fr-n' }, '1'), h('span', { class: 'fr-d' }, inp)),
            h('span', { class: 'unit' }, KP.rich(q.post != null ? q.post : 'des Anfangswerts')))
          : h('div', { class: 'ans-line' }, q.pre ? h('span', { class: 'pre' }, KP.rich(q.pre)) : null, inp, q.unit ? h('span', { class: 'unit' }, KP.rich(q.unit)) : null);
        return { kind: 'num', inputs: [inp], inp: inp, el: h('div', { class: 'ntask' }, head, line) };
      });
      function result(q, i) {
        if (q.o) return store[i] === q.a;
        if (q.nuc) return C.checkNuc(store[i], q.nuc);
        if (q.sci) { var a = store[i] || []; return C.close(C.sciValue(a[0], a[1]), q.v, 0, q.rel || 0.01); }
        return C.checkNumber(store[i], { v: q.v, abs: q.abs || 0, rel: q.rel || 0 });
      }
      function okOf(r) { return typeof r === 'object' ? r.ok : r; }
      return {
        el: h('div', { class: 'tasks' }, items.map(function (it) { return it.el; })),
        check: function () { var m = qs.map(result); return { ok: C.all(m.map(okOf)), marks: m }; },
        mark: function (m) {
          items.forEach(function (it, i) {
            var r = m ? m[i] : true, bad = !!m && !okOf(r);
            if (it.kind === 'mc') {
              it.fs.classList.toggle('bad', bad);
              it.labels.forEach(function (lb, j) { lb.classList.toggle('bad', bad && store[i] === j); });
            } else if (it.kind === 'nuc') {
              it.inputs[0].classList.toggle('bad', bad && !r.a);
              it.inputs[1].classList.toggle('bad', bad && !r.z);
              it.inputs[2].classList.toggle('bad', bad && !r.s);
            } else it.inputs.forEach(function (x) { x.classList.toggle('bad', bad); });
          });
        },
        lock: function (ro, done) {
          items.forEach(function (it) {
            if (it.kind === 'mc') {
              it.radios.forEach(function (r) { r.disabled = !!ro; });
              it.fs.classList.toggle('done', !!done);
            } else E.setInputs(it.inputs, ro, done);
          });
        },
        solution: function () {
          return h('ol', null, qs.map(function (q) {
            if (q.o) return h('li', null, KP.rich(q.o[q.a]));
            if (q.nuc) return h('li', null, KP.nuc(q.nuc[0], q.nuc[1], q.nuc[2]));
            if (q.frac) return h('li', null, [q.pre != null ? q.pre : 'auf', '1/' + q.v, q.post != null ? q.post : 'des Anfangswerts'].join(' ').trim());
            if (q.sci) return h('li', null, String(q.v).replace('.', ',') + ' ' + (q.unit || ''));
            return h('li', null, [q.pre || '', E.num(q.v, 3), q.unit || ''].join(' ').trim());
          }));
        },
        fill: function () {
          qs.forEach(function (q, i) {

            else if (q.sci) {
              var e = Math.floor(Math.log(Math.abs(q.v)) / Math.LN10), m = Math.round(q.v / Math.pow(10, e) * 1000) / 1000;
              store[i] = [E.num(m, 3), String(e)];
              it.inputs[0].value = store[i][0];
              it.inputs[1].value = store[i][1];
            } else E.put(it.inp, store, i, E.num(q.v, 3));

        }

    };

    // ---------- Schritt mit Prüfen-Knopf ----------
    E.step = function (id, title, o) {
      (KP.TITEL[wk.n] = KP.TITEL[wk.n] || {})[id] = title;
      var icon = h('span', { class: 'st-icon', 'aria-hidden': 'true' });
      var badge = h('span', { class: 'st-badge' });
      var head = h('div', { class: 'step-head' }, icon, h('h3', null, title),
        o.optional ? h('span', { class: 'opt-tag' }, 'freiwillig') : null, badge);
      var lockNote = h('p', { class: 'lock-note' }, o.lockText || 'Gesperrt – löse zuerst die Aufgabe davor.');
      var body = h('div', { class: 'step-body' }, o.body);
      var fb = h('p', { class: 'fb', role: 'status', 'aria-live': 'polite' });
      var btn = h('button', { type: 'button', class: 'btn primary', id: 'chk-' + id }, o.btnText || 'Prüfen');
      var foot = h('div', { class: 'step-foot' }, btn, fb);
      var el = h('div', { class: 'step', id: 'step-' + id, 'data-step': id }, head, lockNote, body, foot);
      var tries = null, bFill = null;

        var solBox = h('div', { class: 'solbox', hidden: true });
        var bShow = h('button', { type: 'button', class: 'btn small teacher-btn', id: 'sol-' + id, 'aria-pressed': 'false' }, 'Lösung anzeigen');
        bFill = h('button', { type: 'button', class: 'btn small teacher-btn', id: 'fill-' + id }, 'Lösung einsetzen');

        });

        });
        el.appendChild(h('div', { class: 'teacher-bar' }, h('span', { class: 'tb-lbl' }, 'Lehrkraft:'),
          o.solution ? bShow : null, o.fill ? bFill : null, solBox));
      }
      function run() {
        if (!E.isOpen(id) || E.solved(id)) return;

        w.tries[id] = (w.tries[id] || 0) + 1;
        if (res.ok) {

          if (o.mark) o.mark(null);

          fb.textContent = o.okText || OK_TEXT;
        } else {
          if (o.mark) o.mark(res.marks);

          fb.textContent = res.msg || BAD_TEXT;
        }

        refreshAll();
      }
      btn.addEventListener('click', function () {
        if (o.confirm) KP.confirm(o.confirm[0], o.confirm[1], o.confirm[2]).then(function (yes) { if (yes) run(); });
        else run();
      });
      var st = {
        id: id, el: el,
        refresh: function () {
          var open = E.isOpen(id), done = E.solved(id);
          el.setAttribute('data-state', done ? 'done' : open ? 'open' : 'locked');
          lockNote.hidden = open || done;
          body.hidden = !(open || done);
          foot.hidden = !(open || done);
          btn.hidden = done;
          badge.textContent = done ? 'gelöst' : '';
          if (tries) tries.textContent = w.tries[id] ? 'Versuche: ' + w.tries[id] : '';
          if (bFill) bFill.disabled = done;
          if (done && !fb.textContent) { fb.className = 'fb ok'; fb.textContent = 'Gelöst.'; }
          if (o.lock) o.lock(!open || done, done);
        }
      };
      steps.push(st);
      return st;
    };
    // Fragen-Schritt in einem Aufruf
    E.tasks = function (id, title, qs, o) {
      o = o || {};
      qs = E.gen(id, qs);
      E.Q[id] = qs;
      var store = E.obj(o.store || id, []);
      var tb = E.taskBlock(id, qs, store);
      var st = E.step(id, title, {
        body: (o.before || []).concat([tb.el]).concat(o.after || []),
        check: tb.check, mark: tb.mark, lock: tb.lock, solution: tb.solution, fill: tb.fill,
        optional: o.optional, lockText: o.lockText, okText: o.okText
      });
      st.qs = qs;
      return st;
    };
    // Abschlussaufgabe auf Papier mit Erledigt-Knopf
    E.leifi = function (id, t, o) {
      o = o || {};
      return E.step(id, o.title || 'Aufgabe auf Papier', {
        body: [
          KP.linkCard(t.url, t.src || 'LEIFIphysik · Aufgabe', t.title, t.what || 'Löse die Aufgabe auf Papier. Vergleiche danach mit der Musterlösung („Lösung einblenden“) und verbessere deine Lösung.'),
          t.note ? h('p', { class: 'note' }, KP.rich(t.note)) : null,
          P(t.after || 'Klicke erst auf „Erledigt“, wenn du deine Lösung mit der Musterlösung verglichen und verbessert hast.')
        ],
        btnText: 'Erledigt',
        okText: o.okText || (o.optional ? 'Erledigt!' : 'Erledigt! Du hast alle Pflichtaufgaben dieser Woche bearbeitet.'),
        optional: o.optional, lockText: o.lockText,
        confirm: ['Aufgabe erledigt?', t.confirm || 'Hast du die Aufgabe auf Papier gelöst, mit der Musterlösung verglichen und verbessert?', 'Ja, erledigt'],
        check: function () { return { ok: true }; }
      });
    };
    // Eigene Abschlussaufgabe auf Papier (mit Zahlen je Schüler) und aufklappbarer Musterlösung
    // t: { title, intro, parts: [{ t, s }], note } oder Funktion (R, E) -> so ein Objekt
    E.paper = function (id, t, o) {
      o = o || {};
      t = E.gen(id, t);
      var solBox = h('div', { class: 'ot-sol', id: 'otsol-' + id, hidden: true },
        h('p', { class: 'ot-sol-h' }, 'Musterlösung'),
        h('ol', { class: 'ot-parts', type: 'a' }, t.parts.map(function (p) {
          return h('li', null, (Array.isArray(p.s) ? p.s : [p.s]).map(function (x) { return h('p', null, KP.rich(x)); }));
        })));
      var solBtn = h('button', { type: 'button', class: 'btn small ghost ot-btn', id: 'otbtn-' + id, 'aria-expanded': 'false' }, 'Musterlösung anzeigen');
      solBtn.addEventListener('click', function () {
        var open = solBox.hidden;
        solBox.hidden = !open;
        solBtn.setAttribute('aria-expanded', String(open));
        solBtn.textContent = open ? 'Musterlösung ausblenden' : 'Musterlösung anzeigen';
      });
      var st = E.step(id, o.title || 'Aufgabe auf Papier', {
        body: [
          h('div', { class: 'own-task', id: 'ot-' + id },
            h('p', { class: 'ot-kicker' }, 'Aufgabe'),
            h('h4', { class: 'ot-title' }, t.title),
            t.intro ? h('p', null, KP.rich(t.intro)) : null,
            h('ol', { class: 'ot-parts', type: 'a' }, t.parts.map(function (p) { return h('li', null, KP.rich(p.t)); })),
            t.data ? h('p', { class: 'ot-data' }, KP.rich(t.data)) : null),
          t.note ? h('p', { class: 'note' }, KP.rich(t.note)) : null,
          P('Löse die Aufgabe auf Papier. Vergleiche danach mit der Musterlösung und verbessere deine Lösung. Klicke erst dann auf „Erledigt“.'),
          h('div', { class: 'ot-solwrap' }, solBtn, solBox)
        ],
        btnText: 'Erledigt',
        okText: o.okText || 'Erledigt! Du hast alle Pflichtaufgaben dieser Woche bearbeitet.',
        confirm: ['Aufgabe erledigt?', 'Hast du die Aufgabe auf Papier gelöst, mit der Musterlösung verglichen und verbessert?', 'Ja, erledigt'],
        check: function () { return { ok: true }; }
      });
      st.task = t;
      return st;
    };
    E.section = function (title, kids, cls) {
      secN++;
      return h('section', { class: 'sec' + (cls ? ' ' + cls : ''), id: 'sec-' + secN },
        h('h2', { class: 'sec-h' }, h('span', { class: 'sec-n' }, String(secN)), h('span', null, title)), kids);
    };
    E.widget = function (firstStep, lockText, kids) {
      var note = h('p', { class: 'lock-note' }, lockText);
      var box = h('div', { class: 'widget' }, kids);
      refreshers.push(function () {
        var v = E.visible(firstStep);
        note.hidden = v;
        box.hidden = !v;
      });
      return [note, box];
    };
    // Lesekarten: [url, Quelle, Titel, Auftrag]
    E.cards = function (list) {
      return h('div', { class: 'links' }, list.map(function (c) { return KP.linkCard(c[0], c[1], c[2], c[3]); }));
    };
    E.note = function (t) { return h('p', { class: 'note' }, KP.rich(t)); };

    // ---------- Tabelle mit Zeilen- und Spaltenköpfen ----------
    // corner: fester Text oder { lab: true, store, key, ph } für eine Kopfzelle mit Größe und Einheit
    E.grid = function (idBase, rowLabels, colHeads, store, corner) {
      var inputs = [], cornerInp = null, cornerCell;
      if (corner && corner.lab) {
        cornerInp = E.bindLab(idBase + '-head', corner.store, corner.key, corner.ph || 'Größe in Einheit', 'Kopfzelle der Tabelle');
        cornerCell = h('th', { scope: 'col', class: 'g-corner' }, cornerInp);
      } else cornerCell = h('th', { scope: 'col', class: 'g-corner' }, corner ? KP.rich(corner) : '');
      var head = h('tr', null, cornerCell, colHeads.map(function (c) { return h('th', { scope: 'col' }, KP.rich(c)); }));
      var rows = rowLabels.map(function (lab, r) {
        if (!store[r]) store[r] = blank(colHeads.length);
        var row = [];
        var tr = h('tr', null, h('th', { scope: 'row' }, KP.rich(lab)));
        colHeads.forEach(function (c, ci) {
          var inp = E.bindNum(idBase + '-' + r + '-' + ci, store[r], ci, (typeof lab === 'string' ? lab.replace(/\[\[|\]\]/g, ' ') : 'Zeile ' + (r + 1)) + ', Spalte ' + (ci + 1));
          row.push(inp);
          tr.appendChild(h('td', null, inp));
        });
        inputs.push(row);
        return tr;
      });
      return {
        el: h('div', { class: 'tabwrap' }, h('table', { class: 'mtab gtab', id: idBase }, h('thead', null, head), h('tbody', null, rows))),
        inputs: inputs, corner: cornerInp,
        all: function () { var out = cornerInp ? [cornerInp] : []; inputs.forEach(function (r) { out = out.concat(r); }); return out; },
        mark: function (flags, cornerOk) {
          inputs.forEach(function (row, r) { row.forEach(function (inp, c) { inp.classList.toggle('bad', !!flags && !!flags[r] && flags[r][c] === false); }); });
          if (cornerInp) cornerInp.classList.toggle('bad', cornerOk === false);
        },
        set: function (r, c, v) { E.put(inputs[r][c], store[r], c, String(v)); }
      };
    };

    // ---------- Messprotokoll (nur Lehrkraft) ----------
    E.mlog = function (list, fmt) {
      if (!KP.teacher) return { el: null, render: function () {} };
      var el = h('div', { class: 'mlog', id: 'mlog' });
      function render() {
        el.textContent = '';
        el.appendChild(h('p', { class: 'mlog-h' }, 'Messprotokoll (nur im Lehrermodus sichtbar)'));
        var l = list().slice(-12).reverse();
        if (!l.length) { el.appendChild(h('p', { class: 'mlog-e' }, 'Noch keine Messung.')); return; }
        el.appendChild(h('ul', null, l.map(function (m) { return h('li', null, fmt(m)); })));
      }
      render();
      return { el: el, render: render };
    };
    E.addMeas = function (list, m, max) {
      list.push(m);
      if (list.length > (max || 400)) list.splice(0, list.length - (max || 400));
      KP.save();
    };

    // ---------- Messwerttabelle (Größen als Zeilen) ----------
    // cfg: { cols, store, rows: [{ k, step, name, fixedHead }] }
    E.rowTable = function (cfg) {
      var tb = cfg.store;
      if (!tb.h) tb.h = {};
      var cells = {}, tbody = h('tbody');
      cfg.rows.forEach(function (rd) {
        if (!Array.isArray(tb[rd.k]) || tb[rd.k].length !== cfg.cols) tb[rd.k] = blank(cfg.cols);
        if (tb.h[rd.k] == null) tb.h[rd.k] = '';
        var head = rd.fixedHead ? h('span', { class: 'fixed-head' }, KP.rich(rd.fixedHead))
          : E.bindLab('h-' + rd.k, tb.h, rd.k, 'Größe in Einheit', 'Kopf der Zeile ' + rd.name);
        var vals = [], tr = h('tr', { 'data-row': rd.k }, h('th', { scope: 'row' }, head));
        for (var i = 0; i < cfg.cols; i++) {
          var inp = E.bindNum('v-' + rd.k + '-' + i, tb[rd.k], i, rd.name + ', Spalte ' + (i + 1));
          vals.push(inp);
          tr.appendChild(h('td', null, inp));
        }
        cells[rd.k] = { head: rd.fixedHead ? null : head, vals: vals, tr: tr };
        tbody.appendChild(tr);
      });
      refreshers.push(function () { cfg.rows.forEach(function (rd) { cells[rd.k].tr.hidden = !E.visible(rd.step); }); });
      return {
        el: h('div', { class: 'tabwrap' }, h('table', { class: 'mtab', id: cfg.id || 'mtab' }, tbody)),
        cells: cells,
        inputs: function (keys) {
          var out = [];
          keys.forEach(function (k) { if (cells[k].head) out.push(cells[k].head); out = out.concat(cells[k].vals); });
          return out;
        },
        markRow: function (k, headOk, flags) {
          if (cells[k].head) cells[k].head.classList.toggle('bad', headOk === false);
          E.markList(cells[k].vals, flags);
        },
        setRow: function (k, vals) { vals.forEach(function (v, i) { E.put(cells[k].vals[i], tb[k], i, v); }); },
        setHead: function (k, v) { if (cells[k].head) E.put(cells[k].head, tb.h, k, v); }
      };
    };

    // ---------- Nullrate-Schritt (2-min-Messung ohne Präparat) ----------
    E.nullrate = function (o) {
      var nul = E.obj('nul', { N0: '', Z0: '' });
      var inN0 = E.bindNum('n0', nul, 'N0', 'N₀ in Imp'), inZ0 = E.bindNum('z0', nul, 'Z0', 'Z₀ in Imp/min');
      function noSrc() { return o.meas().filter(function (m) { return !m.src && m.gate === C.GATE; }); }
      var stp = E.step(o.id || 'nullrate', o.title || 'Nullrate messen', {
        body: [
          P(o.text || 'Lege das Präparat in den Bleibehälter. Stelle die Torzeit 2 min ein und miss. Trage die Anzahl der Impulse N₀ ein und gib die Nullrate Z₀ in Imp/min an.'),
          h('div', { class: 'eq-row' }, h('span', { class: 'pre' }, h('i', null, 'N'), '₀ ='), inN0, h('span', { class: 'unit' }, 'Imp')),
          h('div', { class: 'eq-row' }, h('span', { class: 'pre' }, h('i', null, 'Z'), '₀ ='), inZ0, h('span', { class: 'unit' }, 'Imp/min'))
        ],
        lockText: o.lockText,
        check: function () { return C.checkNull(noSrc(), nul); },
        mark: function (m) { inN0.classList.toggle('bad', !!m && !m.N0); inZ0.classList.toggle('bad', !!m && !m.Z0); },
        lock: function (ro, done) { E.setInputs([inN0, inZ0], ro, done); },
        solution: function () {
          var l = noSrc(), m = l[l.length - 1];
          return m ? P('Letzte 2-min-Messung ohne Präparat: N₀ = ' + m.N + ' Imp, also Z₀ = ' + E.num(m.N / 2) + ' Imp/min.')
            : P('Noch keine 2-min-Messung ohne Präparat. „Lösung einsetzen“ misst sofort.');
        },
        fill: function () {
          var l = noSrc(), m = l[l.length - 1];
          if (!m) m = o.quick();
          E.put(inN0, nul, 'N0', String(m.N));
          E.put(inZ0, nul, 'Z0', E.num(m.N / 2));
        }
      });
      stp.nul = nul;
      return stp;
    };

    // ---------- Diagramm mit Achsen, Punkten und Ausgleichskurve ----------
    // cfg: { st, label, xLabels, yLabels, xName, yName, points() -> [[x,y]], scale(), model(points) -> fn, curveOpt, du, prefix }
    E.plotGroup = function (cfg) {
      var pre = cfg.prefix || '';
      var plot = KP.Plot({ st: cfg.st, teacher: KP.teacher, getScale: cfg.scale, label: cfg.label, onChange: function () { KP.save(); } });
      destroyers.push(plot.destroy);
      var idA = pre + 'achsen', idP = pre + 'punkte', idK = pre + 'kurve';
      refreshers.push(function () {
        plot.setLabels(E.active(idA));
        if (E.active(idP)) plot.setMode('points');
        else if (E.active(idK)) plot.setMode('curve');
        else if (!KP.teacher) plot.setMode('none');
        plot.redraw();
      });
      function solution(on) {
        var e = cfg.points(), fn = cfg.model(e);
        if (!fn) { plot.showSolution(null); return P('Erst die Tabelle ausfüllen.'); }
        plot.showSolution(on ? { fn: fn, pts: e, from: cfg.curveOpt.from, to: cfg.curveOpt.to } : null);
        return P('Die Lösung ist lila gestrichelt im Diagramm eingezeichnet.');
      }
      var sAx = E.step(idA, 'Achsen beschriften', {
        body: [P('Beschrifte beide Achsen mit Größe und Einheit. Die Felder dafür findest du an den Pfeilspitzen.')],
        check: function () {
          var m = { x: C.labelOk(cfg.st.xl, cfg.xLabels), y: C.labelOk(cfg.st.yl, cfg.yLabels) };
          return { ok: m.x && m.y, marks: m };
        },
        mark: function (m) { plot.xl.classList.toggle('bad', !!m && !m.x); plot.yl.classList.toggle('bad', !!m && !m.y); },
        lock: function (ro, done) { plot.xl.classList.toggle('ok', !!done); plot.yl.classList.toggle('ok', !!done); },
        solution: function () { return P('Rechtsachse: „' + cfg.xLabels[0] + '“, Hochachse: „' + cfg.yLabels[0] + '“.'); },
        fill: function () { E.put(plot.xl, cfg.st, 'xl', cfg.xLabels[0]); E.put(plot.yl, cfg.st, 'yl', cfg.yLabels[0]); }
      });
      var n = cfg.count || 8;
      var sPts = E.step(idP, 'Messpunkte eintragen', {
        body: [P(cfg.pointsText || ('Trage deine ' + n + ' Messpunkte als Kreuze ein. Tippe, um einen Punkt zu setzen. Ziehe einen Punkt, um ihn zu verschieben.'))],
        check: function () {
          var e = cfg.points(), res = C.checkPoints(cfg.st.pts, e, cfg.scale(), cfg.du);
          return { ok: res.ok, marks: { pts: res.ptOk, frame: cfg.st.pts.length !== e.length } };
        },
        mark: function (m) { plot.setMarks(m); },
        solution: solution,
        fill: function () { cfg.st.pts = cfg.points().map(function (p) { return [p[0], p[1]]; }); plot.setMarks(null); }
      });
      var sCurve = E.step(idK, 'Ausgleichskurve zeichnen', {
        body: [P('Zeichne mit dem Finger in einem Zug eine glatte Ausgleichskurve. Sie muss nicht durch jeden Punkt gehen.')],
        check: function () {
          var e = cfg.points(), res = C.checkCurveFn(cfg.st.curve, cfg.model(e), cfg.scale(), cfg.curveOpt);
          return { ok: res.ok, marks: { curve: false } };
        },
        mark: function (m) { plot.setMarks(m); },
        solution: solution,
        fill: function () {
          var fn = cfg.model(cfg.points()), sc = cfg.scale(), o = cfg.curveOpt, c = [], dx = (o.hi - o.lo) / 120;
          if (!fn) return;
          for (var x = o.lo; x <= o.hi + 1e-9; x += dx) { var y = fn(x); if (y <= sc.ymax) c.push([x, y]); }
          cfg.st.curve = c;
          plot.setMarks(null);
        }
      });
      return { plot: plot, steps: [sAx, sPts, sCurve], el: plot.el };
    };

    // ---------- Seite aufbauen ----------
    var progT = h('span', { class: 'tb-prog-t' }), progB = h('span', { class: 'tb-prog-fill' });
    var prog = h('div', { class: 'tb-prog', role: 'status' }, progT, h('span', { class: 'tb-prog-bar' }, progB));
    var banner = h('div', { class: 'banner', hidden: true }, h('strong', null, 'Geschafft!'), ' Alle Pflichtaufgaben dieser Woche sind erledigt.');
    function refreshAll() {
      steps.forEach(function (s) { s.refresh(); });
      refreshers.forEach(function (f) { f(); });
      var done = ORDER.filter(E.solved).length;
      progT.textContent = done + ' von ' + ORDER.length;
      progB.style.width = (100 * done / ORDER.length).toFixed(1) + '%';
      banner.hidden = done < ORDER.length;
    }
    E.refresh = refreshAll;
    E.mount = function (root, head, sections) {
      root.appendChild(KP.weekBar(wk, prog));
      root.appendChild(h('main', { class: 'wk' },
        h('div', { class: 'wk-head' },
          h('p', { class: 'wk-kicker' }, 'Woche ' + wk.n),
          h('h1', null, head.title || wk.title),
          head.intro ? P(head.intro) : null,
          KP.teacher ? h('p', { class: 'note teacher-note' }, 'Lehrerkonto: Alle Aufgaben sind freigeschaltet. Es wird nichts gespeichert.') : null,
          KP.mode === 'test' && !KP.storageOk ? h('p', { class: 'note warn' }, 'Dieser Browser erlaubt kein Speichern. Dein Fortschritt geht beim Schließen der Seite verloren.') : null),
        banner, sections,
        h('p', { class: 'wk-foot' }, h('a', { class: 'btn ghost', href: '#start', id: 'back-start' }, '← Zur Startseite'))));
      var ids = steps.map(function (s) { return s.id; });
      ORDER.forEach(function (id) { if (ids.indexOf(id) < 0) console.warn('Schritt fehlt: ' + id); });
      refreshAll();
      KP.cur = E;
      return function () { destroyers.forEach(function (f) { try { f(); } catch (e) { /* egal */ } }); KP.cur = null; };
    };
    E.stepIds = function () { return steps.map(function (s) { return s.id; }); };
    return E;
  };

  // Bedienhinweise für den Zähler (in allen Versuchen gleich)
  KP.howto = function (extra) {
    var items = ['Tippe auf die Torzeit und stelle mit den Drehrädern Stunden, Minuten und Sekunden ein. Die Torzeit bleibt eingestellt, bis du sie änderst.',
      '„Start“ startet eine Messung. Nach Ablauf der Torzeit stoppt der Zähler von selbst und zeigt die Anzahl der Impulse. Dann ertönt ein Piepton.',
      'Das Lämpchen leuchtet grün, wenn der Zähler bereit ist, gelb, während er zählt, und rot, wenn die Torzeit abgelaufen ist.',
      'Lies die Impulse ab und trage sie ein. Vor der nächsten Messung drückst du „Reset“: Impulse und Zeit gehen auf null, die Torzeit bleibt.',
      'Den Zeitraffer (×10) kannst du einschalten, sobald eine Messung 30 s läuft.'].concat(extra || [], ['Das Knacken des Zählrohrs kannst du ein- und ausschalten.']);
    return h('details', { class: 'howto' }, h('summary', null, 'So bedienst du den Zähler'), h('ul', null, items.map(function (t) { return h('li', null, t); })));
  };

  KP.renderWeek = function (root, wk) {
    var def = KP.WEEKS[wk.n];
    var E = KP.Engine(wk, def);
    return def.render(E, root);
  };
})();

</script>
<script>
// Interaktive Bausteine: Kernbaukasten, Beschriften durch Ziehen oder Tippen, Kettenreaktion
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, S = KP.svg;

  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function grad(defs, id, c) {
    var g = S('radialGradient', { id: id, cx: '35%', cy: '30%', r: '75%' });
    g.appendChild(S('stop', { offset: '0%', 'stop-color': c[0] }));
    g.appendChild(S('stop', { offset: '55%', 'stop-color': c[1] }));
    g.appendChild(S('stop', { offset: '100%', 'stop-color': c[2] }));
    defs.appendChild(g);
  }

  // =====================================================================
  // Kernbaukasten: Protonen und Neutronen zu vorgegebenen Kernen zusammensetzen
  KP.Kernbau = function (o) {
    var st = o.store;
    if (!st.v || st.v.length !== o.targets.length) st.v = o.targets.map(function () { return [0, 0]; });
    if (st.sel == null) st.sel = 0;
    var locked = false, marks = null, MAX = 20;
    var tabs = o.targets.map(function (t, i) {
      var b = h('button', { type: 'button', class: 'kb-tab', id: 'kb-tab-' + i, 'aria-pressed': 'false', 'aria-label': 'Kern ' + (i + 1) }, KP.nuc(t[0], t[1], t[2]));
      b.addEventListener('click', function () { st.sel = i; draw(); KP.save(); });
      return b;
    });
    var svg = S('svg', { class: 'kb-svg', viewBox: '0 0 260 210', role: 'img', 'aria-label': 'Gebauter Atomkern' });
    var vals = [h('output', { class: 'kb-val', id: 'kb-p-val' }), h('output', { class: 'kb-val', id: 'kb-n-val' })];
    var btns = [];
    function mk(k, d, id, label) {
      var b = h('button', { type: 'button', class: 'btn kb-btn', id: id, 'aria-label': label }, d < 0 ? '−' : '+');
      b.addEventListener('click', function () {
        if (locked) return;
        var v = st.v[st.sel];
        v[k] = clamp(v[k] + d, 0, MAX);
        if (marks) marks[st.sel] = true;
        draw();
        o.onChange();
      });
      btns.push(b);
      return b;
    }
    var ctl = h('div', { class: 'kb-ctl' },
      h('div', { class: 'kb-row' }, h('span', { class: 'kb-dot p' }), h('span', { class: 'kb-lbl' }, 'Protonen'),
        mk(0, -1, 'kb-p-minus', 'Ein Proton weniger'), vals[0], mk(0, 1, 'kb-p-plus', 'Ein Proton mehr')),
      h('div', { class: 'kb-row' }, h('span', { class: 'kb-dot n' }), h('span', { class: 'kb-lbl' }, 'Neutronen'),
        mk(1, -1, 'kb-n-minus', 'Ein Neutron weniger'), vals[1], mk(1, 1, 'kb-n-plus', 'Ein Neutron mehr')));
    var el = h('div', { class: 'kernbau' },
      h('div', { class: 'kb-tabs', role: 'group', 'aria-label': 'Kern auswählen' }, tabs),
      h('div', { class: 'kb-main' }, h('div', { class: 'kb-fig' }, svg), ctl));

    function draw() {
      tabs.forEach(function (b, i) {
        b.setAttribute('aria-pressed', String(i === st.sel));
        b.classList.toggle('bad', !!marks && marks[i] === false);
      });
      var v = st.v[st.sel], p = v[0], n = v[1], N = p + n;
      vals[0].textContent = String(p);
      vals[1].textContent = String(n);
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      var defs = S('defs');
      grad(defs, 'kbg-p', ['#ff8f7d', '#d1342b', '#7d1712']);
      grad(defs, 'kbg-n', ['#f6f8fa', '#a7b1bc', '#56606b']);
      svg.appendChild(defs);
      if (!N) {
        var t = S('text', { x: 130, y: 110, class: 'kb-empty', 'text-anchor': 'middle' });
        t.textContent = 'Noch keine Teilchen';
        svg.appendChild(t);
        return;
      }
      var rb = N > 24 ? 11 : 13, sp = rb * 1.02, cx = 130, cy = 105;

(function () {

        lockText: 'Gesperrt – beantworte zuerst die Fragen zum Einstieg.'
      });
      var nul = sNull.nul;
      var sec2 = E.section('Versuch: Zählrate und Abstand', [
        P('Ein Cäsium-Präparat (Cs-137) steht hinter einer Aluminiumplatte. Die Platte hält die Betastrahlung zurück, zum Zählrohr gelangt nur die Gammastrahlung. ' +
          'Die rote Marke am Reiter zeigt auf dem Lineal den Abstand r zwischen Präparat und Zählrohr. Die Lupe hilft beim Ablesen. Verschiebe das Zählrohr mit dem Finger oder mit den Pfeilknöpfen.'),
        KP.howto(['Während einer Messung kannst du das Zählrohr nicht verschieben und das Präparat nicht herausnehmen.']),
        apparLock, appar.el, log.el, sNull.el
      ]);

      // 3 Messwerttabelle
      var tb = E.rowTable({
        cols: R.length, store: tab, rows: [
          { k: 'r', step: 'messreihe', name: 'Abstand' },
          { k: 'N', step: 'messreihe', name: 'Impulse' },
          { k: 'Z', step: 'zaehlrate', name: 'Zählrate' },
          { k: 'Zs', step: 'bereinigt', name: 'bereinigte Zählrate' }
        ]
      });
      var z0line = h('p', { class: 'z0line' });
      E.onRefresh(function () {
        z0line.hidden = !E.visible('bereinigt');
        z0line.textContent = 'Deine Nullrate: Z₀ = ' + (nul.Z0 || '…') + ' Imp/min';
      });
      var sRN = E.step('messreihe', 'Abstände und Impulse eintragen', {
        body: [P('Fülle die Zeilen für den Abstand r und die Anzahl der Impulse N aus.')],
        check: function () { return C.checkRN(w.meas, { h_r: tab.h.r, h_N: tab.h.N, r: tab.r, N: tab.N }); },
        mark: function (m) { tb.markRow('r', m && m.h_r, m && m.r); tb.markRow('N', m && m.h_N, m && m.N); },
        lock: function (ro, done) { E.setInputs(tb.inputs(['r', 'N']), ro, done); },
        solution: function () {
          return h('div', null, P('Kopf: „r in cm“ und „N in Imp“; r = 10, 20, …, 60.'),
            P('Letzte 2-min-Messungen mit Präparat: ' + R.map(function (r) { var m = lastMeas(true, r); return r + ' cm → ' + (m ? m.N : '–'); }).join(' · ')));
        },
        fill: function () {
          tb.setHead('r', 'r in cm');
          tb.setHead('N', 'N in Imp');
          tb.setRow('r', R.map(String));
          tb.setRow('N', R.map(function (r) { return String(ensureMeas(true, r).N); }));
        }
      });
      var sZ = E.step('zaehlrate', 'Zählrate berechnen', {
        body: [P('Berechne aus den Impulsen die Zählrate Z in Imp/min und trage sie in die nächste Zeile ein.')],
        check: function () { return C.checkZ({ h_Z: tab.h.Z, N: tab.N, Z: tab.Z }); },
        mark: function (m) { tb.markRow('Z', m && m.h_Z, m && m.Z); },
        lock: function (ro, done) { E.setInputs(tb.inputs(['Z']), ro, done); },
        solution: function () { return P('Kopf „Z in Imp/min“; Z = N / 2 min: ' + tab.N.map(function (n) { var x = C.parseNum(n); return isFinite(x) ? E.num(x / 2) : '–'; }).join(' · ')); },
        fill: function () {
          tb.setHead('Z', 'Z in Imp/min');
          tb.setRow('Z', tab.N.map(function (n) { var x = C.parseNum(n); return isFinite(x) ? E.num(x / 2) : ''; }));
        }
      });
      var sZs = E.step('bereinigt', 'Nullrate abziehen', {
        body: [P('Ziehe von jeder Zählrate deine Nullrate Z₀ ab. Das Ergebnis ist die bereinigte Zählrate Z*.')],
        check: function () { return C.checkZs({ h_Zs: tab.h.Zs, Z: tab.Z, Zs: tab.Zs }, nul.Z0); },
        mark: function (m) { tb.markRow('Zs', m && m.h_Zs, m && m.Zs); },
        lock: function (ro, done) { E.setInputs(tb.inputs(['Zs']), ro, done); },
        solution: function () {
          var z0 = C.parseNum(nul.Z0);
          return P('Kopf „Z* in Imp/min“; Z* = Z − Z₀: ' + tab.Z.map(function (z) { var x = C.parseNum(z); return isFinite(x) && isFinite(z0) ? E.num(x - z0) : '–'; }).join(' · '));
        },
        fill: function () {
          var z0 = C.parseNum(nul.Z0);
          tb.setHead('Zs', 'Z* in Imp/min');
          tb.setRow('Zs', tab.Z.map(function (z) { var x = C.parseNum(z); return isFinite(x) && isFinite(z0) ? E.num(x - z0) : ''; }));
        }
      });
      var sec3 = E.section('Messwerttabelle', [
        P('Miss mit Präparat für die Abstände r = 10 cm, 20 cm, …, 60 cm. Die Torzeit bleibt 00:02:00. In die erste Spalte gehört die Größe mit Einheit, zum Beispiel „t in s“.'),
        E.widget('messreihe', 'Die Tabelle wird freigeschaltet, wenn du die Nullrate gemessen hast.', [tb.el, z0line]),
        sRN.el, sZ.el, sZs.el
      ]);

      // 4 Diagramm
      function zs() { return C.zsValues({ Zs: tab.Zs }); }
      var pg = E.plotGroup({
        st: w.plot, label: 'Diagramm: bereinigte Zählrate in Abhängigkeit vom Abstand',
        xLabels: C.LABELS.r, yLabels: C.LABELS.Zs,
        points: function () { return C.expectedPoints(zs()); },
        scale: function () { return C.plotScale(zs()); },
        model: function (e) { var k = C.fitK(e); return function (r) { return k / (r * r); }; },
        curveOpt: C.CURVE_W4, count: R.length,
        pointsText: 'Trage deine sechs Messpunkte (r | Z*) als Kreuze ein. Tippe, um einen Punkt zu setzen. Ziehe einen Punkt, um ihn zu verschieben.'
      });
      var sec4 = E.section('Diagramm', [
        P('Trage die bereinigte Zählrate Z* über dem Abstand r auf: r nach rechts, Z* nach oben. Die Einteilung der Achsen ist schon vorgegeben.'),
        E.widget('achsen', 'Das Diagramm wird freigeschaltet, wenn deine Tabelle vollständig ist.', [pg.el]),
        pg.steps[0].el, pg.steps[1].el, pg.steps[2].el
      ]);

      // 5 Auswertung
      var zsCells = R.map(function () { return h('td', { class: 'ro' }); });
      var unitIn = E.bindLab('p-unit', prod, 'h', 'Einheit', 'Einheit des Produkts');
      var pIns = R.map(function (r, i) { return E.bindNum('p-' + i, prod.P, i, 'Z*·r² für r = ' + r + ' cm'); });
      E.onRefresh(function () { zsCells.forEach(function (td, i) { td.textContent = tab.Zs[i] || '–'; }); });
      var ptab = h('table', { class: 'mtab ptab', id: 'ptab' }, h('tbody', null,
        h('tr', null, h('th', { scope: 'row' }, 'r in cm'), R.map(function (r) { return h('td', { class: 'ro' }, String(r)); })),
        h('tr', null, h('th', { scope: 'row' }, 'Z* in Imp/min'), zsCells),
        h('tr', null, h('th', { scope: 'row' }, h('span', { class: 'pl' }, 'Z*·r² in'), unitIn), pIns.map(function (x) { return h('td', null, x); }))));
      var sProd = E.step('produkt', 'Produkt Z* · r² berechnen', {
        body: [P('Berechne für jede Spalte das Produkt Z* · r² und gib seine Einheit an.')],
        check: function () { return C.checkProd(zs(), { h_P: prod.h, P: prod.P }); },
        mark: function (m) { unitIn.classList.toggle('bad', !!m && !m.h_P); E.markList(pIns, m && m.P); },
        lock: function (ro, done) { E.setInputs([unitIn].concat(pIns), ro, done); },
        solution: function () { var z = zs(); return P('Einheit „' + UNIT_P + '“; Produkte: ' + R.map(function (r, i) { return isFinite(z[i]) ? E.num(z[i] * r * r, 0) : '–'; }).join(' · ')); },
        fill: function () {
          var z = zs();
          E.put(unitIn, prod, 'h', UNIT_P);
          R.forEach(function (r, i) { E.put(pIns[i], prod.P, i, isFinite(z[i]) ? E.num(z[i] * r * r, 0) : ''); });
        }
      });
      function prods() { return prod.P.map(function (x) { return C.parseNum(x); }); }
      var inK = E.bindNum('k', mean, 'k', 'Mittelwert k'), inPred = E.bindNum('pred', mean, 'pred', 'Vorhersage Z* bei 100 cm');
      var sMean = E.step('mittelwert', 'Mittelwert und Vorhersage', {
        body: [
          P('Berechne den Mittelwert k der sechs Produkte. Sage damit voraus, welche bereinigte Zählrate du in 100 cm Abstand messen würdest.'),
          h('div', { class: 'eq-row' }, h('span', { class: 'pre' }, I('k'), ' ='), inK, h('span', { class: 'unit' }, UNIT_P)),
          h('div', { class: 'eq-row' }, h('span', { class: 'pre' }, I('Z'), '*(100 cm) = ', I('k'), ' / (100 cm)² ='), inPred, h('span', { class: 'unit' }, 'Imp/min'))
        ],
        check: function () { return C.checkMean(prods(), mean); },
        mark: function (m) { inK.classList.toggle('bad', !!m && !m.k); inPred.classList.toggle('bad', !!m && !m.pred); },
        lock: function (ro, done) { E.setInputs([inK, inPred], ro, done); },
        solution: function () {
          var k = C.mean(prods());
          return P(isFinite(k) ? 'k = ' + E.num(k, 0) + ' ' + UNIT_P + '; Z*(100 cm) = ' + E.num(k / 10000) + ' Imp/min' : 'Erst die Produkte eintragen.');
        },
        fill: function () {
          var k = C.mean(prods());
          if (!isFinite(k)) return;
          E.put(inK, mean, 'k', E.num(k, 0));
          E.put(inPred, mean, 'pred', E.num(Math.round(k) / 10000));
        }
      });
      var sec5 = E.section('Auswertung', [
        E.widget('produkt', 'Die Auswertung wird freigeschaltet, wenn dein Diagramm fertig ist.', [h('div', { class: 'tabwrap' }, ptab)]),
        sProd.el,
        sMean.el
      ]);

      // 6 Deutung
      var sDeut = E.tasks('deutung', 'Was bedeutet deine Messung?', KP.V.w4.deutung);
      var sec6 = E.section('Deutung', [
        KP.tip('Zwei Größen sind umgekehrt proportional, wenn ihr Produkt immer denselben Wert hat.', L.serloIndirekt, 'Indirekte Proportionalität'),
        sDeut.el
      ]);

      // 7 Sicherung: echter Versuch mit echten Messwerten
      var sSich = E.tasks('sicherung', 'Vergleich mit dem echten Versuch', KP.V.w4.sicherung, {
        before: [
          KP.linkCard(L.leifiAm, 'LEIFIphysik · Versuch', 'Untersuchung der Americium-Strahlung',
            'Lies „Aufbau und Durchführung“, „Beobachtung (qualitativ)“, „Beobachtung (quantitativ)“, „Auswertung (einfach)“ und „Ergebnis“. Die „Auswertung (detailliert)“ kannst du überspringen.'),
          h('p', { class: 'note' }, 'LEIFI nennt die Zählrate ', I('R'), ' und gibt sie in 1/s an, also in Impulsen pro Sekunde. Die Abstände stehen in der Tabelle in mm. ',
            'Die Nullrate heißt bei LEIFI ', I('R'), h('sub', null, 'N'), ', bei uns ', I('Z'), '₀.')
        ]
      });
      var sec7 = E.section('Sicherung: der echte Versuch', [
        P('Du hast das Abstandsgesetz mit deinem simulierten Versuch selbst gefunden. Bei LEIFIphysik findest du einen echten Versuch mit echten Messwerten. Vergleiche ihn mit deinem Ergebnis.'),
        sSich.el
      ]);

      // 8 Übung
      var sU = E.tasks('uebung', 'Rechnen mit dem Abstandsgesetz', KP.V.w4.uebung, { store: 'ueb' });
      var sec8 = E.section('Übung', [
        P('Rechne mit dem Abstandsgesetz. Du darfst den Taschenrechner benutzen.'),
        KP.tip('Die Quadratwurzel √a ist die positive Zahl, die mit sich selbst malgenommen a ergibt, zum Beispiel √16 = 4. Sinkt die Zählrate auf ein Neuntel, ist der Abstand √9 = 3-mal so groß.', L.serloWurzel, 'Quadratwurzel'),
        sU.el
      ]);

      // 9 Zusatz: zwei Fenster
      var kug = KP.Kugel();
      E.onDestroy(kug.destroy);
      var sKug = E.tasks('kugel', 'Zwei Fenster in verschiedenem Abstand', KP.V.w4.kugel, {
        optional: true, lockText: 'Gesperrt – löse zuerst die Übung.', okText: 'Richtig!',
        before: [
          P('Ein Präparat sendet Strahlung gleichmäßig in alle Richtungen aus. Zwei gleich große Fenster (je 4 cm × 4 cm) stehen in 10 cm und in 20 cm Abstand. Starte die Simulation und beobachte, wie viele Strahlen die Fenster treffen.'),
          kug.el
        ]
      });
      var sec9 = E.section('Zusatzaufgabe (freiwillig)', [sKug.el], 'sec-opt');

      // 10 Abschlussaufgabe: Lernaufgabe des IQB für den Mittleren Schulabschluss (Sekundarstufe I)
      var sLeifi = E.leifi('leifi', {
        url: L.iqbStrahlenschutz, src: 'IQB · Lernaufgabe Physik, Mittlerer Schulabschluss', title: 'Strahlenschutz – Teilaufgabe 2: Messunsicherheiten',
        what: 'Öffne die Aufgabe und blättere zu Seite 4. Löse dort die Teilaufgaben 2.1 bis 2.3 auf Papier. Teilaufgabe 1 bearbeitest du nicht. Vergleiche danach mit den Lösungshinweisen auf Seite 14 und 15 und verbessere deine Lösung.',
        note: 'Ein Unsicherheitsbalken zeigt den Bereich, in dem der wahre Wert vermutlich liegt.',
        after: 'Klicke erst auf „Erledigt“, wenn du deine Lösung mit den Lösungshinweisen verglichen und verbessert hast.',
        confirm: 'Hast du die Teilaufgaben 2.1 bis 2.3 auf Papier gelöst, mit den Lösungshinweisen verglichen und verbessert?'
      });
      var sec10 = E.section('Abschlussaufgabe', [sLeifi.el]);

      var stop = E.mount(root, { title: 'Abstandsgesetz', intro: 'Wie hängt die Zählrate vom Abstand zum Präparat ab? Das findest du mit einem simulierten Zählrohr selbst heraus. Danach vergleichst du dein Ergebnis mit einem echten Versuch.' },
        [sec1, sec2, sec3, sec4, sec5, sec6, sec7, sec8, sec9, sec10]);
      KP.w4 = { refresh: E.refresh, week: w, plot: pg.plot, apparatus: appar, kugel: kug };
      return function () { stop(); KP.w4 = null; };
    }
  });
})();

</script>
<script>
// Wochen 1 bis 3: Atom- und Kernaufbau · Nachweis, Nullrate, Zufall, Aktivität · Alpha-, Beta- und Gammastrahlung
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, C = KP.C, P = KP.P;

  // =====================================================================
  // Woche 1
  KP.defineWeek({
    n: 1,
    order: ['lesen', 'baukasten', 'tabelle', 'schreibweise', 'isotope', 'leifi'],
    optional: { groesse: 'isotope' },
    render: function (E, root) {
      var L = E.L, T = E.T, V = KP.V.w1;
      var targets = E.gen('baukasten', V.baukasten), rows = E.gen('tabelle', V.tabelle);
      var qSchr = E.gen('schreibweise', V.schreibweise), qIso = E.gen('isotope', V.isotope);

      var sLesen = E.tasks('lesen', 'Fragen zu den Texten', T.lesen);
      var sec1 = E.section('Einstieg: Atom und Atomkern', [
        P('Lies die drei Texte bei LEIFIphysik. Beantworte danach die Fragen.'),
        E.cards([
          [L.leifiAtom, 'LEIFIphysik', 'Atomaufbau', 'Lies den Kasten „Das Wichtigste auf einen Blick“ und den Abschnitt „Atom aus Elektronen, Protonen und Neutronen“.'],
          [L.leifiKern, 'LEIFIphysik', 'Aufbau von Atomkernen', 'Lies den Kasten „Das Wichtigste auf einen Blick“ und den Abschnitt „Kernaufbau aus Protonen und Neutronen“.'],
          [L.leifiNuklidStabil, 'LEIFIphysik', 'Nuklidkarte stabiler Kerne', 'Lies den Kasten „Das Wichtigste auf einen Blick“.']
        ]),
        sLesen.el
      ]);

      // Kernbaukasten
      var kst = E.obj('kern', {});
      var kb = KP.Kernbau({ targets: targets, store: kst, onChange: function () { KP.save(); } });
      var sKb = E.step('baukasten', 'Atomkerne bauen', {
        body: [P('Baue die vier Kerne aus Protonen und Neutronen. Wähle oben einen Kern aus. Lege dann mit den Knöpfen fest, wie viele Protonen und Neutronen er enthält.'), kb.el],
        check: function () {
          var m = targets.map(function (t, i) { var v = kst.v[i]; return v[0] === t[1] && v[1] === t[0] - t[1]; });
          return { ok: C.all(m), marks: m };
        },
        mark: function (m) { kb.mark(m); },
        lock: function (ro) { kb.setLocked(ro); },
        solution: function () {
          return h('ul', null, targets.map(function (t) { return h('li', null, KP.nuc(t[0], t[1], t[2]), ' ' + t[1] + ' Protonen, ' + (t[0] - t[1]) + ' Neutronen'); }));
        },
        fill: function () { kb.fill(); }
      });
      var sec2 = E.section('Kernbaukasten', [sKb.el]);

      // Tabelle
      var tg = E.obj('tab', []);
      var grid = E.grid('ptab1', rows.map(function (r) { return '[[' + r.nuc.join(',') + ']]'; }), ['Protonen', 'Neutronen', 'Elektronen'], tg, 'neutrales Atom');
      function tabFlags() { return rows.map(function (r, i) { return r.v.map(function (v, c) { return C.parseNum(tg[i][c]) === v; }); }); }
      var sTab = E.step('tabelle', 'Protonen, Neutronen und Elektronen', {
        body: [P('Gib für jedes neutrale Atom an, wie viele Protonen, Neutronen und Elektronen es hat.'), grid.el],
        check: function () { var f = tabFlags(); return { ok: f.every(C.all), marks: f }; },
        mark: function (m) { grid.mark(m); },
        lock: function (ro, done) { E.setInputs(grid.all(), ro, done); },
        solution: function () { return h('ul', null, rows.map(function (r) { return h('li', null, KP.nuc(r.nuc[0], r.nuc[1], r.nuc[2]), ' ' + r.v.join(' / ')); })); },
        fill: function () { rows.forEach(function (r, i) { r.v.forEach(function (v, c) { grid.set(i, c, v); }); }); }
      });
      var sSchr = E.tasks('schreibweise', 'Kernschreibweise', qSchr, {
        before: [P('Schreibe die Kerne in Kernschreibweise: Massenzahl oben, Kernladungszahl unten, dahinter das Elementsymbol.'), KP.pse(qSchr.pse)]
      });
      var sec3 = E.section('Kerne beschreiben', [sTab.el, sSchr.el]);

      var sIso = E.tasks('isotope', 'Isotope', qIso, { before: [KP.pse(qIso.pse)] });
      var sec4 = E.section('Isotope', [sIso.el]);

      var sGr = E.tasks('groesse', 'Wie groß ist ein Atomkern?', V.groesse, {
        optional: true, lockText: 'Gesperrt – löse zuerst die Aufgaben zu den Isotopen.', okText: 'Richtig!',
        before: [P('Ein Atom hat einen Durchmesser von etwa 0,000 000 000 1 m. Sein Kern ist ungefähr 10 000-mal kleiner: Er hat einen Durchmesser von etwa 0,000 000 000 000 01 m. Trotzdem steckt fast die ganze Masse des Atoms im Kern.')]
      });
      var sec5 = E.section('Zusatzaufgabe (freiwillig)', [sGr.el], 'sec-opt');
      var sLeifi = E.leifi('leifi', {
        url: L.leifiNZ, title: 'Die N-Z-Nuklidkarte',
        what: 'Löse die Teilaufgaben a) bis c) auf Papier. Teilaufgabe d) lässt du weg. Vergleiche danach mit der Musterlösung („Lösung einblenden“) und verbessere deine Lösung.'
      });
      var sec6 = E.section('Abschlussaufgabe', [sLeifi.el]);
      return E.mount(root, { intro: 'Woraus besteht ein Atom und woraus sein Kern? Du liest bei LEIFIphysik nach, baust selbst Atomkerne zusammen und lernst, wie man Atomkerne aufschreibt.' },
        [sec1, sec2, sec3, sec4, sec5, sec6]);
    }
  });

  // =====================================================================
  // Woche 2: Zählrohr, Nullrate und der Zufall beim radioaktiven Zerfall
  // Einzelmessungen: zehnmal 10 s und dreimal 2 min, jede Messung einzeln gestartet
  var GK = 10, GL = 120, NK = 10, NL = 3;
  KP.defineWeek({
    n: 2,
    order: ['lesen', 'kurz', 'lang', 'zaehlrate', 'saeulen', 'mittel', 'deutung', 'sicherung', 'aktivitaet', 'leifi'],
    optional: { zaehlung: 'aktivitaet' },
    render: function (E, root) {
      var w = E.w, L = E.L, T = E.T;
      if (!w.meas) w.meas = [];
      if (!w.app) w.app = {};
      if (!w.z0) w.z0 = KP.makeZ0();
      var tab = E.obj('tab', {});
      [['n10', NK], ['z10', NK], ['n120', NL], ['z120', NL]].forEach(function (x) { if (!Array.isArray(tab[x[0]]) || tab[x[0]].length !== x[1]) tab[x[0]] = KP.blank(x[1]); });
      var bst = E.obj('bars', {});
      var mit = E.obj('mittel', { m10: '', s10: '', m120: '', s120: '' });

      // 1 Einstieg (höchstens 10 Minuten)
      var sLesen = E.tasks('lesen', 'Fragen zum Einstieg', T.lesen);
      var sec1 = E.section('Einstieg: das Geiger-Müller-Zählrohr', [
        P('Heute untersuchst du, was ein Geiger-Müller-Zählrohr misst, wenn gar kein Präparat in der Nähe ist – und wie genau eine solche Messung ist. Lies dazu kurz bei LEIFIphysik nach und beantworte die Fragen.'),
        E.cards([[L.leifiZaehlrohr, 'LEIFIphysik', 'GEIGER-MÜLLER-Zählrohr', 'Lies nur den Kasten „Das Wichtigste auf einen Blick“ und den Abschnitt „Typischer Versuchsaufbau mit GMZ“.']]),
        sLesen.el
      ]);

      // 2 Versuch: Einzelmessungen ohne Präparat
      var log = E.mlog(function () { return w.meas; }, function (m) { return 'Torzeit ' + KP.gateLabel(m.gate) + ' · N = ' + m.N; });
      function addMeas(m) { E.addMeas(w.meas, m, 400); log.render(); }
      function quick(gate) { var m = { src: false, r: 5, abs: '', gate: gate, N: KP.poisson(w.z0 / 60 * gate), t: Date.now() }; addMeas(m); return m; }
      function measOf(gate) { return w.meas.filter(function (m) { return !m.src && m.gate === gate; }); }
      // die letzten n Messungen mit dieser Torzeit (fehlende misst die Lehrkraft sofort)
      function lastOf(gate, n) {
        var l = measOf(gate).slice(-n);
        while (l.length < n) l.push(quick(gate));
        return l;
      }
      var appar = KP.Apparatus({
        state: w.app, mode: 'fixed', fixedPos: 5, rulerMax: 10, bare: true, sources: [],
        rate: function () { return w.z0 / 60; },
        teacher: KP.teacher, onMeasure: addMeas,
        onQuickAll: function () { for (var i = 0; i < NK; i++) quick(GK); for (var j = 0; j < NL; j++) quick(GL); }
      });
      E.onDestroy(appar.destroy);
      var apparLock = h('p', { class: 'lock-note' }, 'Der Versuch wird freigeschaltet, wenn du die Fragen zum Einstieg richtig beantwortet hast.');
      E.onRefresh(function () { var open = E.isOpen('kurz'); appar.setLocked(!open); apparLock.hidden = open; });

      // Tabellen der beiden Messreihen
      function seriesTable(id, gate, n, kN, kZ, stepZ) {
        var nIn = [], zIn = [];
        for (var i = 0; i < n; i++) {
          nIn.push(E.bindNum(id + '-n-' + i, tab[kN], i, 'Torzeit ' + KP.gateLabel(gate) + ', ' + (i + 1) + '. Messung, N'));
          zIn.push(E.bindNum(id + '-z-' + i, tab[kZ], i, 'Torzeit ' + KP.gateLabel(gate) + ', ' + (i + 1) + '. Messung, Z'));
        }
        var zRow = h('tr', { class: 'zrow' }, h('th', { scope: 'row' }, h('span', { class: 'fixed-head' }, 'Z in Imp/min')), zIn.map(function (x) { return h('td', null, x); }));
        E.onRefresh(function () { zRow.hidden = !E.visible(stepZ); });
        var el = h('div', { class: 'tabwrap' }, h('table', { class: 'mtab stab', id: id },
          h('caption', null, 'Torzeit ' + KP.gateLabel(gate)),
          h('tbody', null,
            h('tr', null, h('th', { scope: 'row' }, 'Messung'), nIn.map(function (x, i) { return h('td', { class: 'ro' }, String(i + 1)); })),
            h('tr', null, h('th', { scope: 'row' }, h('span', { class: 'fixed-head' }, 'N in Imp')), nIn.map(function (x) { return h('td', null, x); })),
            zRow)));
        return { el: el, n: nIn, z: zIn };
      }
      var tK = seriesTable('tab10', GK, NK, 'n10', 'z10', 'zaehlrate'), tL = seriesTable('tab120', GL, NL, 'n120', 'z120', 'zaehlrate');
      function seriesStep(id, gate, n, t, kN, title, text, lockText) {
        return E.step(id, title, {
          body: [P(text)],
          lockText: lockText,
          check: function () {
            var f = C.matchMulti(tab[kN], measOf(gate));
            return { ok: C.all(f), marks: f, msg: C.all(f) ? null : 'Die rot markierten Werte gehören zu keiner deiner Messungen mit der Torzeit ' + KP.gateLabel(gate) + '. Jede Messung darf nur einmal vorkommen.' };
          },
          mark: function (m) { E.markList(t.n, m); },
          lock: function (ro, done) { E.setInputs(t.n, ro, done); },
          solution: function () { var l = measOf(gate).slice(-n); return P('Letzte Messungen mit ' + KP.gateLabel(gate) + ': ' + (l.length ? l.map(function (m) { return m.N; }).join(' · ') : '–')); },
          fill: function () { lastOf(gate, n).forEach(function (m, i) { E.put(t.n[i], tab[kN], i, String(m.N)); }); }
        });
      }
      var sKurz = seriesStep('kurz', GK, NK, tK, 'n10', 'Zehn Messungen mit der Torzeit 10 s',
        'Stelle die Torzeit 00:00:10 ein. Miss dann zehnmal nacheinander: „Start“ drücken, warten, bis der Zähler stoppt, die Anzahl der Impulse N in die obere Tabelle eintragen, „Reset“ drücken.',
        'Gesperrt – beantworte zuerst die Fragen zum Einstieg.');
      var sLang = seriesStep('lang', GL, NL, tL, 'n120', 'Drei Messungen mit der Torzeit 2 min',
        'Stelle jetzt die Torzeit 00:02:00 ein und miss dreimal. Den Zeitraffer kannst du einschalten, sobald eine Messung 30 s läuft. Trage die Impulse N in die untere Tabelle ein.');
      function zOk(kN, kZ, n, fac) {
        return KP.blank(n).map(function (x, i) { var v = C.parseNum(tab[kN][i]); return isFinite(v) && C.close(C.parseNum(tab[kZ][i]), v * fac, 0.01); });
      }
      var sZ = E.step('zaehlrate', 'Zählraten berechnen', {
        body: [P('Rechne jede Impulszahl N in die Zählrate Z in Imp/min um. Trage die Zählraten in die Zeilen „Z in Imp/min“ beider Tabellen ein.'),
          KP.tip('Eine Minute hat 60 s, also passt eine 10-s-Messung sechsmal in eine Minute. Eine 2-min-Messung dauert doppelt so lang wie eine Minute.', L.serloDreisatz, 'Dreisatz')],
        check: function () { var a = zOk('n10', 'z10', NK, 6), b = zOk('n120', 'z120', NL, 0.5); return { ok: C.all(a) && C.all(b), marks: { a: a, b: b } }; },
        mark: function (m) { E.markList(tK.z, m && m.a); E.markList(tL.z, m && m.b); },
        lock: function (ro, done) { E.setInputs(tK.z.concat(tL.z), ro, done); },
        solution: function () { return P('Bei 10 s: Z = N · 6. Bei 2 min: Z = N : 2.'); },
        fill: function () {
          for (var i = 0; i < NK; i++) { var a = C.parseNum(tab.n10[i]); if (isFinite(a)) E.put(tK.z[i], tab.z10, i, E.num(a * 6, 1)); }
          for (var j = 0; j < NL; j++) { var b = C.parseNum(tab.n120[j]); if (isFinite(b)) E.put(tL.z[j], tab.z120, j, E.num(b / 2, 1)); }
        }
      });
      var sec2 = E.section('Versuch: ein Zählrohr ganz ohne Präparat', [
        P('Das Zählrohr ist an den Zähler angeschlossen. Ein radioaktives Präparat ist nicht in der Nähe. Du misst zuerst zehnmal mit der Torzeit 10 s und danach dreimal mit der Torzeit 2 min. Jede Messung startest du einzeln.'),
        KP.howto(),
        apparLock, appar.el, log.el,
        E.widget('kurz', 'Die Tabellen werden freigeschaltet, wenn du die Fragen zum Einstieg richtig beantwortet hast.', [tK.el, tL.el]),
        sKurz.el, sLang.el, sZ.el
      ]);

      // 3 Säulendiagramm
      function zv(k) { return tab[k].map(function (x) { return C.parseNum(x); }); }
      function scale() {
        var all = zv('z10').concat(zv('z120')).filter(isFinite);
        return C.plotScaleGen(all.length ? all : [60], 1, 1);
      }
      var bars = KP.Bars({
        st: bst, label: 'Säulendiagramm der Zählraten beider Messreihen',
        series: [{ key: 'a', n: NK, label: 'Torzeit 10 s', short: '10 s', cls: 'ba' }, { key: 'b', n: NL, label: 'Torzeit 2 min', short: '2 min', cls: 'bb' }],
        getScale: scale, yLabel: 'Z in Imp/min', xLabel: 'Messung', onChange: function () { KP.save(); }
      });
      E.onDestroy(bars.destroy);
      function barFlags() {
        var sc = scale(), tol = Math.max(1, 0.02 * sc.ymax);
        function f(key, k) { return zv(k).map(function (z, i) { var v = bst[key][i]; return isFinite(z) && v != null && Math.abs(v - z) <= tol + 1e-9; }); }
        return { a: f('a', 'z10'), b: f('b', 'z120') };
      }
      function stats(k, n) {
        var v = zv(k).filter(isFinite);
        if (v.length < n) return null;
        return { mean: C.mean(v), min: Math.min.apply(null, v), max: Math.max.apply(null, v) };
      }
      E.onRefresh(function () {
        bars.setEditable(E.active('saeulen'));
        var a = stats('z10', NK), b = stats('z120', NL);
        bars.setExtras((E.solved('mittel') || KP.teacher) && a && b
          ? { means: { a: a.mean, b: b.mean }, ranges: { a: [a.min, a.max], b: [b.min, b.max] } } : null);
      });
      var sBars = E.step('saeulen', 'Säulendiagramm zeichnen', {
        body: [P('Stelle die Zählraten beider Messreihen in einem Säulendiagramm dar. Links stehen die zehn 10-s-Messungen (schwarz), rechts die drei 2-min-Messungen (blau). Tippe in die Spalte einer Säule und ziehe sie mit dem Finger auf die richtige Höhe.')],
        check: function () { var m = barFlags(); return { ok: C.all(m.a) && C.all(m.b), marks: m }; },
        mark: function (m) { bars.setMarks(m); },
        solution: function () { return P('Die Säulen haben die Höhe der Zählraten aus den Tabellen.'); },
        fill: function () { bst.a = zv('z10').map(function (z) { return isFinite(z) ? z : null; }); bst.b = zv('z120').map(function (z) { return isFinite(z) ? z : null; }); bars.setMarks(null); }
      });
      var sec3 = E.section('Diagramm: Wie stark schwanken die Werte?', [
        E.widget('saeulen', 'Das Diagramm wird freigeschaltet, wenn beide Tabellen vollständig sind.', [bars.el]),
        sBars.el
      ]);

      // 4 Mittelwert und Spannweite
      var ins = {};
      ['m10', 's10', 'm120', 's120'].forEach(function (k) { ins[k] = E.bindNum('mi-' + k, mit, k, k); });
      function row(label, a, b, u) {
        return h('tr', null, h('th', { scope: 'row' }, label), h('td', null, a, h('span', { class: 'unit' }, u)), h('td', null, b, h('span', { class: 'unit' }, u)));
      }
      var z0line = h('p', { class: 'z0line' });
      E.onRefresh(function () {
        z0line.hidden = !E.solved('mittel');
        z0line.textContent = 'Deine Nullrate (Mittelwert der 2-min-Messungen): Z₀ = ' + (mit.m120 || '…') + ' Imp/min';
      });
      function mChecks() {
        var a = stats('z10', NK), b = stats('z120', NL);
        return {
          m10: !!a && C.close(C.parseNum(mit.m10), a.mean, 0.051), s10: !!a && C.close(C.parseNum(mit.s10), a.max - a.min, 0.01),
          m120: !!b && C.close(C.parseNum(mit.m120), b.mean, 0.051), s120: !!b && C.close(C.parseNum(mit.s120), b.max - b.min, 0.01)
        };
      }
      var sMit = E.step('mittel', 'Mittelwert und Spannweite', {
        body: [
          P('Berechne für jede Messreihe den Mittelwert der Zählraten und die Spannweite. Die Spannweite ist der größte minus der kleinste Wert. Runde Mittelwerte auf eine Nachkommastelle.'),
          h('div', { class: 'tabwrap' }, h('table', { class: 'mtab mstat', id: 'mstat' },
            h('thead', null, h('tr', null, h('th', null, ''), h('th', { scope: 'col' }, 'Torzeit 10 s'), h('th', { scope: 'col' }, 'Torzeit 2 min'))),
            h('tbody', null, row('Mittelwert', ins.m10, ins.m120, 'Imp/min'), row('Spannweite', ins.s10, ins.s120, 'Imp/min')))),
          z0line
        ],
        check: function () { var m = mChecks(); return { ok: m.m10 && m.s10 && m.m120 && m.s120, marks: m }; },
        mark: function (m) { Object.keys(ins).forEach(function (k) { ins[k].classList.toggle('bad', !!m && !m[k]); }); },
        lock: function (ro, done) { E.setInputs([ins.m10, ins.s10, ins.m120, ins.s120], ro, done); },
        solution: function () {
          var a = stats('z10', NK), b = stats('z120', NL);
          return P(a && b ? '10 s: Mittelwert ' + E.num(a.mean, 2) + ', Spannweite ' + E.num(a.max - a.min, 1) + ' · 2 min: Mittelwert ' + E.num(b.mean, 2) + ', Spannweite ' + E.num(b.max - b.min, 1) : 'Erst die Tabellen ausfüllen.');
        },
        fill: function () {
          var a = stats('z10', NK), b = stats('z120', NL);
          if (!a || !b) return;
          E.put(ins.m10, mit, 'm10', E.num(a.mean, 1)); E.put(ins.s10, mit, 's10', E.num(a.max - a.min, 1));
          E.put(ins.m120, mit, 'm120', E.num(b.mean, 1)); E.put(ins.s120, mit, 's120', E.num(b.max - b.min, 1));
        }
      });
      var sDeut = E.tasks('deutung', 'Was zeigen deine Messungen?', T.deutung);
      var sec4 = E.section('Auswertung', [sMit.el, sDeut.el]);

      // 5 Sicherung: echter Versuch und Zufall beim Zerfall
      var merke = h('div', { class: 'merke', hidden: true }, h('p', { class: 'merke-h' }, 'Merke'),
        P('Die Schwankungen deiner Messwerte sind keine Messfehler. Auch ein perfektes Zählrohr misst schwankende Werte, denn die Atomkerne zerfallen zu zufälligen Zeitpunkten. Dieser Zufall steckt in den Atomkernen selbst. Die Physik beschreibt ihn mit der Quantenphysik, die du in der Oberstufe kennenlernst.'),
        P('Je länger du misst, desto mehr Impulse zählst du und desto weniger fällt der Zufall ins Gewicht. Deshalb wählst du in den nächsten Wochen lange Torzeiten von 1 min oder 2 min.'));
      E.onRefresh(function () { merke.hidden = !E.solved('sicherung'); });
      var sSich = E.tasks('sicherung', 'Vergleich mit einem echten Versuch', T.sicherung, {
        before: [E.cards([
          [L.leifiBallon, 'LEIFIphysik · Versuch', 'Umweltradioaktivität mit dem Luftballon', 'Lies „Ziel des Versuchs“, „Versuchsaufbau“, „Versuchsdurchführung“ und „Messergebnisse“.'],
          [L.leifiHalb, 'LEIFIphysik', 'Halbwertszeit', 'Lies nur den ersten Absatz und sieh dir die Animation dazu an. Hör vor dem zweiten Absatz auf.']
        ]), h('p', { class: 'note' }, 'LEIFI schreibt „Counts“ für die Anzahl der Impulse in einer Torzeit.')],
        after: [merke]
      });
      var sec5 = E.section('Sicherung: Zufall beim radioaktiven Zerfall', [
        P('Bei LEIFIphysik misst jemand die Strahlung in einem Gebäude mit einem Zählrohr. Auch dort spielt die Nullrate eine wichtige Rolle. Außerdem liest du, was man über den Zerfall eines einzelnen Atomkerns weiß.'),
        sSich.el
      ]);

      // 6 Aktivität
      var sAkt = E.tasks('aktivitaet', 'Aktivität', KP.V.w2.aktivitaet, {
        before: [KP.linkCard(L.leifiAktiv, 'LEIFIphysik', 'Aktivität eines Präparats', 'Lies den Kasten „Das Wichtigste auf einen Blick“, den Abschnitt „Definition der Aktivität“ und den Abschnitt „Aktivität des Menschen“.')],
        after: [KP.tip('Große Zahlen schreibt man mit Zehnerpotenzen, zum Beispiel 32 000 = 3,2 · 10⁴. Die Hochzahl gibst du im kleinen oberen Feld ein.', L.serloPotSchreib, 'Potenzschreibweise großer Zahlen')]
      });
      var sec6 = E.section('Aktivität eines Präparats', [sAkt.el]);

      // 7 Zusatz: Aktivität und Zählrate
      var sZus = E.tasks('zaehlung', 'Aktivität und Zählrate', KP.V.w2.zaehlung, {
        optional: true, lockText: 'Gesperrt – löse zuerst die Aufgabe zur Aktivität.', okText: 'Richtig!',
        before: [P('Ein Zählrohr erfasst nur einen kleinen Teil der Strahlung eines Präparats. Rechne aus, was der Zähler anzeigt.')]
      });
      var sec7 = E.section('Zusatzaufgabe (freiwillig)', [sZus.el], 'sec-opt');

      var sLeifi = E.leifi('leifi', { url: L.leifiNulleffekt, title: 'Nulleffekt' });
      var sec8 = E.section('Abschlussaufgabe', [sLeifi.el]);
      var stop = E.mount(root, { intro: 'Mit einem Geiger-Müller-Zählrohr weist man ionisierende Strahlung nach. Du untersuchst mit einem simulierten Zählrohr, was es misst, wenn gar kein Präparat in der Nähe ist – und wie stark die Messwerte schwanken.' },
        [sec1, sec2, sec3, sec4, sec5, sec6, sec7, sec8]);
      KP.w2 = { bars: bars, week: w, apparatus: appar };
      return function () { stop(); KP.w2 = null; };
    }
  });

  // =====================================================================
  // Woche 3: Welche Strahlung steckt hinter A, B und C? Zuordnung und Zählraten je Schüler
  var W3SRC = ['A', 'B', 'C'], W3ABS = ['ohne', 'papier', 'alu', 'blei'];
  function w3Setup(R) {
    var types = R.shuffle(['alpha', 'beta', 'gamma']), map = {}, r = {};
    W3SRC.forEach(function (L, i) {
      var t = types[i], o;
      map[L] = t;
      if (t === 'alpha') { o = Math.round(R.between(2000, 2800)); r[L] = { ohne: o, papier: 0, alu: 0, blei: 0 }; }
      else if (t === 'beta') { o = Math.round(R.between(1500, 2100)); r[L] = { ohne: o, papier: Math.round(o * R.between(0.92, 0.97)), alu: 0, blei: 0 }; }
      else { o = Math.round(R.between(700, 1100)); r[L] = { ohne: o, papier: o, alu: Math.round(o * R.between(0.94, 0.97)), blei: Math.round(o * R.between(0.25, 0.35)) }; }
    });
    return { z0: KP.makeZ0(), map: map, r: r };
  }
  KP.defineWeek({
    n: 3,
    order: ['lesen', 'nullrate', 'tabelle', 'verhalten', 'sicherung', 'uebung', 'leifi'],
    optional: { reichweite: 'uebung' },
    render: function (E, root) {
      var w = E.w, L = E.L, T = E.T;
      if (!w.meas) w.meas = [];
      if (!w.app) w.app = {};
      if (!w.p || !w.p.map) w.p = w3Setup(E.rng('setup'));
      function rateOf(src, abs) { return (w.p.z0 + (src ? w.p.r[src][abs] : 0)) / 60; }

      // Einstieg (höchstens 10 Minuten)
      var sLesen = E.tasks('lesen', 'Fragen zum Einstieg', T.lesen);
      var sec1 = E.section('Einstieg: eine zufällige Entdeckung', [
        P('Henri Becquerel entdeckte eine unsichtbare Strahlung, die von Uran ausgeht. Heute untersuchst du die Strahlung von drei unbekannten Präparaten. Lies zuerst, wie alles anfing, und beantworte die Fragen.'),
        E.cards([[L.leifiBecquerel, 'LEIFIphysik · Geschichte', 'Henri BECQUEREL (1852–1908)', 'Lies den kurzen Artikel.']]),
        sLesen.el
      ]);

      var log = E.mlog(function () { return w.meas; }, function (m) {
        return KP.gateLabel(m.gate) + ' · ' + (m.src ? 'Präparat ' + m.src + ', ' + m.abs : 'ohne Präparat') + ' · N = ' + m.N;
      });
      function addMeas(m) { E.addMeas(w.meas, m); log.render(); }
      function quick(src, abs, gate) { var m = { src: src, r: 3, abs: abs, gate: gate, N: KP.poisson(rateOf(src, abs) * gate), t: Date.now() }; addMeas(m); return m; }
      function find(src, abs, gate) {
        for (var i = w.meas.length - 1; i >= 0; i--) { var m = w.meas[i]; if (m.src === src && m.abs === abs && m.gate === gate) return m; }
        return null;
      }
      var appar = KP.Apparatus({
        state: w.app, mode: 'fixed', fixedPos: 3, rulerMax: 10, absPos: 1.5,
        sources: [{ id: 'A', label: 'A' }, { id: 'B', label: 'B' }, { id: 'C', label: 'C' }],
        absorbers: [{ id: 'ohne', label: 'ohne' }, { id: 'papier', label: 'Papier', kind: 'paper', thick: 0.05 },
          { id: 'alu', label: 'Aluminium 3 mm', short: 'Al', kind: 'al', thick: 0.3 }, { id: 'blei', label: 'Blei 2 cm', short: 'Blei', kind: 'pb', thick: 2 }],
        rate: function (s) { return rateOf(s.src, s.abs); },
        teacher: KP.teacher, onMeasure: addMeas,
        onQuickAll: function () { quick(false, 'ohne', C.GATE); W3SRC.forEach(function (s) { W3ABS.forEach(function (a) { quick(s, a, 60); }); }); }
      });
      E.onDestroy(appar.destroy);
      var apparLock = h('p', { class: 'lock-note' }, 'Der Versuch wird freigeschaltet, wenn du die Fragen zum Einstieg richtig beantwortet hast.');
      E.onRefresh(function () { var open = E.isOpen('nullrate'); appar.setLocked(!open); apparLock.hidden = open; });
      var sNull = E.nullrate({
        meas: function () { return w.meas; },
        quick: function () { return quick(false, w.app.abs || 'ohne', C.GATE); },
        text: 'Lege das Präparat in den Bleibehälter („keins“). Stelle die Torzeit 00:02:00 ein und miss. Trage die Anzahl der Impulse N₀ ein und gib die Nullrate Z₀ in Imp/min an.',
        lockText: 'Gesperrt – beantworte zuerst die Fragen zum Einstieg.'
      });

      var tst = E.obj('tab', { h: '', v: [] });
      var grid = E.grid('ztab', ['Präparat A', 'Präparat B', 'Präparat C'], ['ohne', 'Papier', 'Aluminium 3 mm', 'Blei 2 cm'], tst.v,
        { lab: true, store: tst, key: 'h', ph: 'Größe in Einheit' });
      function tabCheck() {
        var f = W3SRC.map(function (s, r) {
          return W3ABS.map(function (a, c) {
            var v = C.parseNum(tst.v[r][c]);
            return C.isInt(v) && w.meas.some(function (m) { return m.src === s && m.abs === a && m.gate === 60 && m.N === v; });
          });
        });
        var hOk = C.labelOk(tst.h, C.LABELS.Z);
        return { ok: hOk && f.every(C.all), marks: { f: f, h: hOk } };
      }
      var sTab = E.step('tabelle', 'Zählraten messen', {
        body: [P('Stelle die Torzeit 00:01:00 ein. Miss für jedes Präparat ohne Abschirmung und mit jeder Abschirmung je einmal. Bei 1 min Torzeit ist die Anzahl der Impulse gleich der Zählrate Z in Imp/min. Trage sie in die Tabelle ein. In die Ecke der Tabelle gehört die Größe mit Einheit.'), grid.el],
        check: tabCheck,
